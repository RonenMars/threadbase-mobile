appId: com.ronenmars.threadbase
env:
  # Metro host:port for this machine. Override per run:
  #   maestro test -e METRO_HOST=192.168.1.23:8081 e2e/launch-debug.yaml
  METRO_HOST: localhost:8081
---
# Launch Debug build and handle expo-dev-client menu
# This assumes you have a local server in the dev menu

- launchApp

# Wait for dev menu to appear
- waitForAnimationToEnd:
    timeout: 5000

# Look for your local server entry (adjust text to match your server name)
# If you see "Enter URL manually", tap it and enter localhost:8081
- runFlow:
    when:
      visible:
        text: "Enter URL manually"
    commands:
      - tapOn:
          text: "Enter URL manually"
      - inputText: "exp://${METRO_HOST}"
      - tapOn:
          text: "Connect"
      - waitForAnimationToEnd:
          timeout: 10000

# Or if your server is already in the list, tap it:
- runFlow:
    when:
      visible:
        text: "${METRO_HOST}"
    commands:
      - tapOn:
          text: "${METRO_HOST}"
      - waitForAnimationToEnd:
          timeout: 10000

# Now app should be loaded and ready for testing
- assertVisible:
    text: "Begin handshake"  # Your app's first screen
