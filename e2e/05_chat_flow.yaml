# Maestro E2E — Chat flow fixes
#
# Validates the 6 chat-flow fixes applied to LiveConversationView and related
# hooks. Uses the local mock server (http://localhost:7071) so no live streamer
# is required.
#
# Fixes covered:
#   Fix 2 — ThinkingBubble appears while session is running (isAgentThinking)
#   Fix 3 — WakingUpOverlay does NOT appear for an existing session (promptCount > 0)
#   Fix 5 — Sent message bubble is visible (optimistic dedup doesn't over-clear)
#
# Run with:
#   npm run test:e2e:mock
# or directly:
#   node e2e/run-maestro.js test --debug-output e2e/_artifacts/debug e2e/05_chat_flow.yaml

appId: com.ronenmars.threadbase
---
- runFlow: setup.yaml

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 8000

- takeScreenshot: e2e/_artifacts/screenshots/chat-flow-00-hub.png

# ── Navigate to running session ────────────────────────────────────────────────
# first-session-card → session-abc123: status=running, promptCount=3
# Fix 3: isWakingUp must be FALSE (promptCount > 0 means not first run)
#
# Default hub is classic + mergeChats. The merged list auto-collapses the
# session block when there are more than 3 sessions (SESSIONS_COLLAPSE_THRESHOLD
# in app/index.tsx). The mock fixture has 4, so LIVE · 4 is showing and the
# cards are hidden — run 32004798693 failed here with only conversation rows
# in the hierarchy. Expand the header only when the card is not already visible.

- extendedWaitUntil:
    visible:
      id: "live-sessions-header"
    timeout: 8000
    optional: true

- runFlow:
    when:
      notVisible:
        id: "first-session-card"
    commands:
      - tapOn:
          id: "live-sessions-header"

- extendedWaitUntil:
    visible:
      id: "first-session-card"
    timeout: 10000

- tapOn:
    id: "first-session-card"

- extendedWaitUntil:
    visible:
      id: "session-detail-screen"
    timeout: 12000

- takeScreenshot: e2e/_artifacts/screenshots/chat-flow-01-session-open.png

# ── Fix 3: WakingUpOverlay must NOT appear for an existing session ─────────────

- assertNotVisible:
    id: "waking-up-overlay"

# ── Chat composer is available ─────────────────────────────────────────────────

- extendedWaitUntil:
    visible:
      id: "chat-message-input"
    timeout: 8000

- takeScreenshot: e2e/_artifacts/screenshots/chat-flow-02-composer.png

# ── Fix 5: Send a message — optimistic bubble appears immediately ──────────────

- tapOn:
    id: "chat-message-input"
- inputText: "hello from chat-flow e2e"

# No hideKeyboard here. The composer dismisses the keyboard itself —
# ChatComposer.handleSend calls Keyboard.dismiss() before onSend() — and the send
# button sits in the composer row above the keyboard, so it is tappable with the
# keyboard up. Dropping the step also removes the Maestro 2.6.1 / iOS 26.x
# silent-no-op risk recorded in issue #611.
#
# Do not "fix" a future keyboard problem here with `pressKey: Enter`: this input
# is multiline, so Enter inserts a newline and the text assertion below fails.
- tapOn:
    id: "chat-send-button"

# Wait for the keyboard dismissal the send triggered, so the transcript
# assertions below run against an unobstructed screen.
- waitForAnimationToEnd

# Terminal lines carry an accessibility label of "Line <n>: <content>", and
# Maestro matches `text:` against the *whole* label as a regex — so the bare
# string never matches. The leading `.*` is required, not defensive. Don't
# pin the number: it shifts with the replay content above.
- extendedWaitUntil:
    visible:
      text: ".*hello from chat-flow e2e"
    timeout: 8000

- takeScreenshot: e2e/_artifacts/screenshots/chat-flow-03-message-sent.png

# No thinking-bubble assertion here, and adding one back needs mock work first.
#
# ThinkingBubble renders inside LiveConversationView, which this session never
# mounts: session-detail.json has neither conversationId nor boundConversationId,
# so hasConversationId is false and app/session/[id].tsx returns early from the
# view-mode chip rather than switching to chat. The session stays on the terminal
# surface — the failure hierarchy here shows terminal-line-row and no chat view.
#
# So tapping session-view-mode-chip does not help: it is a silent no-op for this
# fixture. Covering the bubble end-to-end means giving the fixture a
# conversationId and mocking the conversation-messages route, i.e. a new mock
# surface rather than a flow edit.
#
# The component itself is unit-tested in
# __tests__/unit/components/conversation/ThinkingBubble.{question,skeleton}.test.tsx.
# What is uncovered is the integration path: a running session actually showing it.
