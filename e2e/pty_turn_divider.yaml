# Maestro E2E — PTY session smoke
# Verifies the PTY session screen mounts the terminal output container
# and the compose input area. (Filename kept for npm script + ROADMAP
# compatibility; previously asserted "YOU →" divider rows that have
# since been removed in favour of showing terminal output as-is.)
#
# Strategy: openLink with the threadbase:// deep link targets the
# session/[id] route directly, bypassing the hub project-row tap
# (which is undrivable on iOS — see e2e/README.md "Known limits").
#
# Requires: mock server running on localhost:7071
# Usage: maestro test e2e/pty_turn_divider.yaml (or via npm run test:e2e:mock)

appId: com.ronenmars.threadbase
---
- runFlow: setup.yaml

# Hub chrome is mounted
- assertVisible:
    id: "hub-screen"

# Deep-link into the PTY session (ptyAttached: true in fixtures/sessions.json)
- openLink: "threadbase:///session/session-abc123"

# iOS shows a "Open in Threadbase?" system confirmation for incoming deeplinks.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"

# Session detail screen is mounted
- extendedWaitUntil:
    visible:
      id: "session-detail-screen"
    timeout: 8000

# Compose input is present (TerminalView mounts a ChatComposer)
- assertVisible:
    id: "chat-message-input"

# Visual: PTY session detail screen with terminal output + compose input.
- takeScreenshot: e2e/_artifacts/screenshots/pty-divider-01-session-detail
