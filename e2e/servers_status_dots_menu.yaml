appId: ${APP_BUNDLE_ID}
---
# Verify that tapping the 3-dots on a server row in the Servers Status modal
# opens the per-server action menu (Refresh / Edit / Delete).
#
# Prerequisites: app already has at least one server configured.
# Run with: maestro test e2e/servers_status_dots_menu.yaml

- launchApp:
    clearState: false

# Wait for the hub to fully load
- extendedWaitUntil:
    visible:
      text: "Threadbase"
    timeout: 10000

# Tap the cloud/server-status button in the header
- tapOn:
    text: "Server status"

# Give the modal time to animate
- waitForAnimationToEnd
- waitForAnimationToEnd

# Tap the 3-dots on the first server row
- tapOn:
    id: "server-row-dots-btn"

# Give the action menu time to animate
- waitForAnimationToEnd

# Assert all three actions visible
- assertVisible:
    text: "Refresh"

- assertVisible:
    text: "Edit"

- assertVisible:
    text: "Delete"

# Dismiss by tapping the backdrop
- tapOn:
    point: "50%, 10%"

- waitForAnimationToEnd

# Confirm action menu is gone
- assertNotVisible:
    text: "Refresh"
