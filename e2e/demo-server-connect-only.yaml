appId: ${APP_BUNDLE_ID}
---
# Test demo server connection with production onboarding
# Server: set DEMO_SERVER_URL env var (pass via -e DEMO_SERVER_URL=... to maestro)
# API Key: tb_public_demo_reviewer_key

- launchApp:
    clearState: true
    clearKeychain: true

# Wait for onboarding splash screen
- waitForAnimationToEnd

# Should see the welcome screen and its CTA. Match by testID, not the visible
# string — "Begin handshake" never shipped; the real copy is "Get started"
# and testID/copy drift is exactly what broke this assertion before.
- assertVisible:
    id: "onboarding-welcome-cta"

- tapOn:
    id: "onboarding-welcome-cta"

# Wait for pairing options screen
- waitForAnimationToEnd

# Should see "Connect a runtime" screen with QR or manual options
- assertVisible:
    text: "Connect a runtime."

# Tap the manual entry option using testID
- tapOn:
    id: "onboarding-connect-paste-card"

# Wait for manual entry form
- waitForAnimationToEnd

# Now we should see the server connection form
- assertVisible:
    id: "onboarding-connect-url-input"

# Tap URL input and clear any existing content
- tapOn:
    id: "onboarding-connect-url-input"
- eraseText
- waitForAnimationToEnd

# Enter demo server URL
- inputText: ${DEMO_SERVER_URL}

# Wait a moment for input to settle
- waitForAnimationToEnd

# Maestro 2.6.1's hideKeyboard does not dismiss the iOS 26.x keyboard
# (docs/superpowers/plans/2026-08-01-extract-scroll-fab.md). Scroll the
# KeyboardAwareScrollView instead so the token field clears the keyboard,
# matching the precedent in 07_conversation_scroll_gaps.yaml.
- swipe:
    start: 50%, 45%
    end: 50%, 25%
    duration: 300
- waitForAnimationToEnd

# Tap token input and clear any existing content
- tapOn:
    id: "onboarding-connect-token-input"
- eraseText
- waitForAnimationToEnd

# Enter demo API key
- inputText: "tb_public_demo_reviewer_key"

# Wait a moment for input to settle
- waitForAnimationToEnd

# Same Maestro/iOS-26 hideKeyboard limitation as above — the on-screen
# keyboard sits on top of the handshake CTA (docs/research/2026-05-26-...),
# so scroll instead of hiding to bring it back into view.
- swipe:
    start: 50%, 45%
    end: 50%, 25%
    duration: 300

# Tap the connect/handshake button
- tapOn:
    id: "onboarding-connect-handshake-cta"

# Wait for connection to succeed
- waitForAnimationToEnd:
    timeout: 10000

# Verify we're past the connection screen (success!)
- assertNotVisible:
    text: "Connection failed"

# Dismiss iOS password save dialog if it appears
- runFlow:
    when:
      visible:
        text: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

# A pasted key can't be verified against the server, so pairing now routes
# through the confirm gate (components/pair/PairConfirmGate.tsx) before the
# server is added. Wait for it, then accept.
- extendedWaitUntil:
    visible:
      id: "pair-confirm-add-btn"
    timeout: 10000

# The password dialog races the confirm gate: when it wins, it sits on top and
# swallows the tap below, leaving the flow parked on the gate. Clear it first.
- runFlow:
    when:
      visible:
        text: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

- tapOn:
    id: "pair-confirm-add-btn"

- waitForAnimationToEnd

# The password dialog can also land on top of the confirm gate's result.
- runFlow:
    when:
      visible:
        text: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

# After successful connection, app advances to Notifications step (step 3/4)
# Wait for navigation
- waitForAnimationToEnd:
    timeout: 5000

# Advance past the notifications step (the CTA is "Continue", not "Skip")
- tapOn:
    id: "onboarding-notifications-cta"

# Wait for Done step (step 4/4)
- waitForAnimationToEnd:
    timeout: 3000

# Dismiss iOS password save dialog if it appears (can show here too)
- runFlow:
    when:
      visible:
        text: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

# Tap the "Enter Threadbase" button to complete onboarding
- tapOn:
    id: "onboarding-done-cta"

# Wait for navigation to hub
- waitForAnimationToEnd:
    timeout: 10000

# Verify we're on the hub by checking for the FAB
- assertVisible:
    id: "fab-new-session"

# Tap the new session FAB to open project picker
- tapOn:
    id: "fab-new-session"

# Wait for Browse modal to appear
- waitForAnimationToEnd:
    timeout: 3000

# The Browse modal shows project folders
# Tap on the first project directory
- tapOn:
    id: "browse-first-directory"

# Wait for project selection/navigation
- waitForAnimationToEnd:
    timeout: 2000

# Now tap "Start Session Here" button to create the session
- tapOn:
    text: "Start Session Here"

# Wait for session to be created and screen to load
- waitForAnimationToEnd:
    timeout: 15000

# The leave-session modal traps accessibility — while it is up, nothing behind
# it appears in the hierarchy at all, so every assertion below reads as "not
# visible" rather than "obscured". Dismiss it before asserting on the screen.
- runFlow:
    when:
      visible:
        id: "leave-session-modal"
    commands:
      - tapOn:
          id: "leave-session-cancel"
      - waitForAnimationToEnd

# Should now be in a live session screen
- assertVisible:
    id: "session-detail-screen"

# Type a test prompt
- tapOn:
    id: "chat-message-input"
- inputText: "What is 2+2?"

# Hide keyboard so send button is visible
- hideKeyboard

# Wait for keyboard to hide
- waitForAnimationToEnd

# Tap send button to send the message
- tapOn:
    id: "chat-send-button"

# Wait for response to start streaming
- waitForAnimationToEnd:
    timeout: 20000

# Still on the session screen after sending (there is no `terminal-output`
# testID — assert the session view instead)
- assertVisible:
    id: "session-detail-screen"

# Test the info button functionality — it lives behind the header overflow
# menu, not as a directly tappable button
- tapOn:
    id: "session-overflow-menu"

- waitForAnimationToEnd

- tapOn:
    id: "session-info-button"

# Wait for info modal to appear
- waitForAnimationToEnd

# Verify info modal opened by checking for close button
- assertVisible:
    id: "info-modal-close-button"

# Close the info modal
- tapOn:
    id: "info-modal-close-button"

# Wait for modal to close
- waitForAnimationToEnd

# Verify modal closed
- assertNotVisible:
    id: "info-modal-close-button"

# Navigate back from the live session
- tapOn:
    id: "screen-header-back-button"

# Wait for navigation animation
- waitForAnimationToEnd

# Leaving a live session asks what to do with the agent still running on the
# computer. Keep it alive so the session is still there to re-enter below.
- runFlow:
    when:
      visible:
        id: "leave-session-modal"
    commands:
      - tapOn:
          id: "leave-session-option-leave"
      - tapOn:
          id: "leave-session-confirm"
      - waitForAnimationToEnd

# Should now be back on projects hub with session list
# Wait for the list to load
- waitForAnimationToEnd:
    timeout: 5000

# Confirming the leave modal tears the session down before it pops, so the hub
# can take longer to appear than an animation settle — wait for it rather than
# asserting the instant the previous wait returns.
- extendedWaitUntil:
    visible:
      id: "fab-new-session"
    timeout: 15000

# With classic layout and mergeChats=false, we should be on Sessions tab by default
# Verify sessions are visible in the list
# The session we created should be there at the top (most recent)

# Wait for sessions to load
- waitForAnimationToEnd:
    timeout: 3000

# Tap on the first session card using its testID
- tapOn:
    id: "first-session-card"

# Wait for navigation to session detail
- waitForAnimationToEnd:
    timeout: 5000

# Verify we entered the session (now in conversation/history view)
- assertVisible:
    id: "session-detail-screen"

# Verify our conversation history is visible with our prompt text.
# The terminal renders the prompt line with a leading "› " marker, so match
# as a substring. "+" and "?" are regex metacharacters and must be escaped.
- assertVisible:
    text: ".*What is 2\\+2\\?.*"

# Test completed successfully - we verified:
# 1. Connection to demo server works ✓
# 2. New session can be created ✓
# 3. Messages can be sent and responses received ✓
# 4. Terminal output displays correctly ✓
# 5. Info modal opens and closes ✓
# 6. Navigation back to hub works ✓
# 7. Session can be found in list and re-entered ✓
# 8. Conversation history persists ✓
