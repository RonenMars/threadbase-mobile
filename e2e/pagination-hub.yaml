# Pagination e2e — hub view.
#
# Same boot sequence as pagination-classic but ends in the hub layout. Hub
# groups conversations by project, so the visible rows are project names
# (one row per project, with aggregated counts) rather than per-conversation.
# The mock spreads 346 conversations across 5 projects (alpha/beta/gamma/
# delta/epsilon-service), so all 5 should be reachable as distinct rows.
#
# Requires: pagination mock running on http://localhost:7072.

appId: com.ronenmars.threadbase
---
- runScript: scripts/reset-pagination-mock.js

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    when:
      visible:
        id: "onboarding-welcome-cta"
    commands:
      - tapOn:
          id: "onboarding-welcome-cta"
      - tapOn:
          id: "onboarding-theme-cta"
      - tapOn:
          id: "onboarding-valueprop-cta"
      - tapOn:
          id: "onboarding-connect-paste-card"
      - tapOn:
          id: "onboarding-connect-url-input"
      - inputText: "http://localhost:7072"
      - tapOn:
          id: "onboarding-connect-token-input"
      - inputText: "mock-key-pagination"
      - tapOn:
          id: "onboarding-connect-handshake-cta"
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
      - extendedWaitUntil:
          visible:
            id: "onboarding-notifications-cta"
          timeout: 10000
      - tapOn:
          id: "onboarding-notifications-cta"
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
      - tapOn:
          id: "onboarding-tour-cta"
      - tapOn:
          id: "onboarding-tour-cta"
      - tapOn:
          id: "onboarding-tour-cta"
      - tapOn:
          id: "onboarding-done-cta"

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 10000

# Switch to hub layout.
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Hub"
    timeout: 5000
- tapOn: "Hub"
# Maestro's `back` (swipe-from-edge) is unreliable on iOS 26 sims; use the
# expo-router Stack header chevron, exposed via testID in app/_layout.tsx.
- tapOn:
    id: "header-back"

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 10000

# Hub renders one row per project. Project cards expose a testID
# `hub-project-<projectName>`. FlashList virtualises rows; let paint settle
# before snapshotting the accessibility tree.
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "hub-project-alpha-service"
    timeout: 30000

- takeScreenshot: e2e/_artifacts/pagination-hub-01-top

# Verify all 5 project rows are reachable. The mock spreads conversations
# evenly across 5 projects, so each row should appear after at most a small
# scroll.
- scrollUntilVisible:
    element:
      id: "hub-project-beta-app"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 30

- scrollUntilVisible:
    element:
      id: "hub-project-gamma-cli"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 30

- scrollUntilVisible:
    element:
      id: "hub-project-delta-web"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 30

- scrollUntilVisible:
    element:
      id: "hub-project-epsilon-mobile"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 30

- takeScreenshot: e2e/_artifacts/pagination-hub-02-all-projects
