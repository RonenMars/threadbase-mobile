# Android-specific launch flow.
#
# On Android dev-client APKs, `launchApp` opens the Expo dev-launcher
# (server picker) rather than the JS app — so Maestro never sees our
# onboarding/hub UI. This flow expects the caller to deep-link into the
# JS bundle *before* invoking Maestro:
#
#   adb shell pm clear com.ronenmars.threadbase
#   adb shell am start -a android.intent.action.VIEW \
#     -d 'exp+threadbase-mobile://expo-development-client/?url=http%3A%2F%2F192.168.68.111%3A8081' \
#     com.ronenmars.threadbase
#
# Then walks the onboarding carousel and asserts hub-screen.
#
# Requires: mock server on localhost:7071, Metro on 8081,
#           adb reverse for both ports, emulator authorized.

appId: com.ronenmars.threadbase
---
# Don't relaunch — the caller already deep-linked us into the JS bundle.
# Expo dev-client may show a first-launch tutorial sheet ("This is the
# developer menu" + Continue button) and/or the standard dev-menu sheet
# (Reload / Go home / Toggle perf monitor). Both block the JS app. Poll
# for either, dismiss, and repeat. After 3 passes (~6s), assume they're
# gone and proceed.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
      - runFlow:
          when:
            visible: "Toggle performance monitor"
          commands:
            - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 2000

# JS cold-start on Android dev-client + Fabric can take ~25-30s after the
# dev-menu closes; give it 60s of headroom so we don't race the bundle.
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome-cta"
    timeout: 60000

- runFlow:
    when:
      visible:
        id: "onboarding-welcome-cta"
    commands:
      - tapOn:
          id: "onboarding-welcome-cta"
      - tapOn:
          id: "onboarding-theme-cta"
      - tapOn:
          id: "onboarding-valueprop-cta"
      - tapOn:
          id: "onboarding-connect-paste-card"
      - tapOn:
          id: "onboarding-connect-url-input"
      - inputText: "http://localhost:7071"
      - tapOn:
          id: "onboarding-connect-token-input"
      - inputText: "mock-key-123"
      # Dismiss the soft keyboard so it doesn't cover the Connect CTA.
      - hideKeyboard
      - tapOn:
          id: "onboarding-connect-handshake-cta"
      - extendedWaitUntil:
          visible:
            id: "onboarding-notifications-cta"
          timeout: 15000
      - tapOn:
          id: "onboarding-notifications-cta"
      - tapOn:
          id: "onboarding-tour-cta"
      - tapOn:
          id: "onboarding-tour-cta"
      - tapOn:
          id: "onboarding-tour-cta"
      - tapOn:
          id: "onboarding-done-cta"

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 15000

- takeScreenshot: /tmp/maestro-android-hub
