appId: ${APP_BUNDLE_ID}
---
# Lightweight demo-server smoke: onboard against the demo server, create a
# session, send one message, confirm we stayed on the session screen.
# Heavier coverage (info modal, back-nav, re-enter) lives in
# demo-server-connect-only.yaml.
#
# Server: set DEMO_SERVER_URL env var (pass via -e DEMO_SERVER_URL=... to maestro)
# API Key: tb_public_demo_reviewer_key
#
# Onboarding (welcome → … → hub) is delegated to setup-demo.yaml so this flow
# only owns the session-create + send assertions and can't rot when the
# onboarding carousel changes.

- runFlow: setup-demo.yaml

# ── Create a session from the hub ─────────────────────────────────────────────
- tapOn:
    id: "fab-new-session"

- extendedWaitUntil:
    visible:
      id: "browse-first-directory"
    timeout: 5000
- tapOn:
    id: "browse-first-directory"

- tapOn:
    text: "Start Session Here"

- extendedWaitUntil:
    visible:
      id: "session-detail-screen"
    timeout: 15000

# ── Send one message ──────────────────────────────────────────────────────────
- tapOn:
    id: "chat-message-input"
- inputText: "Hello from App Review test!"

- hideKeyboard
- waitForAnimationToEnd

- tapOn:
    id: "chat-send-button"

- waitForAnimationToEnd

# Still on the session screen — test passed if we got this far.
- assertVisible:
    id: "session-detail-screen"
