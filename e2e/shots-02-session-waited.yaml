# Same as shots-02-session but waits 8 seconds after navigation so the WS
# terminal_replay has time to land + render. Diagnostic: if this shows
# content but the no-wait version doesn't, the screenshot is firing before
# the replay paints. If even this shows the loader, there's a deeper bug.

appId: com.ronenmars.threadbase
---
- runFlow: setup-demo.yaml

# Hub uses tree-view: drill into project, then tap its single session row.
- tapOn:
    id: "tree-row-/home/demo/projects/threadbase-mobile"

- extendedWaitUntil:
    visible:
      id: "drill-cwd-/home/demo/projects/threadbase-mobile"
    timeout: 5000

# Demo conversation id for the threadbase-mobile replay. DrillRow derives its
# testID from item.key as `conversation-row-<id>` (the demo seed exposes its
# sessions as historical conversations because the PTY isn't attached).
- tapOn:
    id: "conversation-row-5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e"

# Demo data only has finished conversations (no live PTY), so the row routes
# to /conversation/<id> (replay view), not /session/<id>. The replay view
# exposes `conversation-bottom-bar` rather than `session-detail-screen`.
- extendedWaitUntil:
    visible:
      id: "conversation-bottom-bar"
    timeout: 8000

- waitForAnimationToEnd:
    timeout: 8000

- takeScreenshot: e2e/_artifacts/screenshots/shots-02-session-waited
