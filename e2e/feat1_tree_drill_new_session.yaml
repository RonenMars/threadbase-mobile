# Maestro E2E — Feature 1: path drill pre-fills new-session cwd
# Flow:
#   1. Land on the hub (Now is the default sessionsLayout).
#   2. Switch to Projects with the segmented control on the hub.
#   3. Open the project card and tap its "Browse path" footer to drill in.
#   4. Tap the FAB to start a new session.
#   5. Assert the browse screen opened with cwd pre-filled to the drilled path.
#
# Without this feature the FAB pushes /browse?server=<id> with no path, and
# the breadcrumb would render only `~`. With the feature the breadcrumb
# container testID becomes `browse-cwd-/home/user/my-project`.
#
# Requires: mock server running on localhost:7071
# Usage: node e2e/run-maestro.js test e2e/feat1_tree_drill_new_session.yaml (or via npm run test:e2e:mock)

appId: com.ronenmars.threadbase
---
- runFlow: setup.yaml

- assertVisible:
    id: "hub-screen"

# Now is the default; the path drill lives under Projects (the Tree layout's
# successor, docs/design/session-list, PR 9).
- tapOn:
    id: "layout-projects"

# Fixture has three sessions under /home/user/my-project, so the hub renders
# one card for it. Open the card, then drill into its directory.
- extendedWaitUntil:
    visible:
      id: "hub-project-my-project"
    timeout: 8000

- tapOn:
    id: "hub-project-my-project"

- extendedWaitUntil:
    visible:
      id: "hub-browse-path-/home/user/my-project"
    timeout: 5000

- tapOn:
    id: "hub-browse-path-/home/user/my-project"

# DrillView mounts with a testID that encodes the drilled cwd. This is the
# signal the FAB will read from the treeDrill store.
- assertVisible:
    id: "drill-cwd-/home/user/my-project"

# Tap the FAB to start a new session.
- tapOn:
    id: "fab-new-session"

# The browse screen mounts with the cwd pre-filled. Without the feature this
# would be `browse-cwd-~` (the server default).
- extendedWaitUntil:
    visible:
      id: "browse-cwd-/home/user/my-project"
    timeout: 5000
