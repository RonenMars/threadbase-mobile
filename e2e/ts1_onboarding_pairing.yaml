# Maestro E2E — TS1: Onboarding and Pairing
# Source: production-test-suites/ts1-onboarding-and-pairing.md
#
# Covers TC-TS1-002: manual URL/token pairing from a clean install, walking
# the 3-step onboarding flow (Welcome -> Connect -> Done) at a human pace —
# one field at a time, real animation waits instead of racing the UI — so
# the recording reads like a person configuring the app rather than a
# script hammering testIDs. Also covers TC-TS1-002's relaunch acceptance
# criterion (credentials persist, onboarding is skipped).
#
# The Notifications step exists in the codebase but is not part of the
# onboarding flow (removed from OnboardingNavigator) — nothing to drive here.
#
# TC-TS1-001 (QR pairing) is NOT covered here: Maestro cannot present a real
# camera frame to `expo-camera`'s scanner, so the QR handshake itself can't
# be driven end to end.
# TC-TS1-003 (invalid credentials / unreachable server) lives in
# ts1_invalid_pairing.yaml.
#
# Requires: mock server running on localhost:7071 (npm run test:e2e:ts1 starts
# it automatically).

appId: com.ronenmars.threadbase
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# --- Step 1/3 WELCOME ---
- assertVisible:
    id: "onboarding-welcome-cta"
- tapOn:
    id: "onboarding-welcome-cta"
- waitForAnimationToEnd

# --- Step 2/3 CONNECT — TC-TS1-002: manual URL/token pairing ---
- assertVisible:
    id: "onboarding-connect-paste-card"
- tapOn:
    id: "onboarding-connect-paste-card"
- waitForAnimationToEnd

- tapOn:
    id: "onboarding-connect-url-input"
- inputText: "http://localhost:7071"
- waitForAnimationToEnd
- hideKeyboard
- waitForAnimationToEnd

- tapOn:
    id: "onboarding-connect-token-input"
- inputText: "mock-key-123"
- waitForAnimationToEnd
- hideKeyboard
- waitForAnimationToEnd

- takeScreenshot: e2e/_artifacts/screenshots/ts1-01-manual-form-filled

- tapOn:
    id: "onboarding-connect-handshake-cta"

# iOS may show a "Save Password?" dialog after secureTextEntry input
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"

# Handshake mock schedule runs ~2.4s (dial/resolve/handshake/paired) —
# give it real headroom rather than a fixed sleep.
- extendedWaitUntil:
    visible:
      id: "onboarding-done-cta"
    timeout: 8000

- takeScreenshot: e2e/_artifacts/screenshots/ts1-02-paired

# --- Step 3/3 DONE ---
- tapOn:
    id: "onboarding-done-cta"

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 8000

- takeScreenshot: e2e/_artifacts/screenshots/ts1-03-hub-after-pairing

# Acceptance: relaunch skips onboarding, preserves the configured server
# (expo-secure-store survives clearState — see e2e/README.md).
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 8000

- takeScreenshot: e2e/_artifacts/screenshots/ts1-04-relaunch-skips-onboarding
