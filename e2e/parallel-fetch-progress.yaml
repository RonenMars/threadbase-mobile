# Merged-list lazy pagination — e2e validation.
#
# Verifies that:
#   1. The sessions loading overlay appears on hub load and then disappears.
#   2. The first page of conversations is visible in the merged hub list
#      (mergeChats is enabled by default — no separate History tab needed).
#   3. Scrolling the merged list fetches the NEXT page, i.e. lazy pagination is
#      actually wired to onEndReached.
#
# (3) replaces this flow's original assertion, which watched a conversation
# progress bar fill as the eager drain walked every page up front. ADR 0001
# step 2 deleted that drain and that progress bar: conversations now arrive one
# page at a time as the user scrolls, so "did page 2 ever load" is the property
# worth testing and "did the bar reach 100%" no longer exists.
#
# MOCK_TOTAL_CONVERSATIONS must exceed the query's page size (50) or there is no
# second page to fetch and this flow cannot fail. 120 gives three pages.
#
# Requires: pagination mock running on http://localhost:7073.
# Start with:
#   MOCK_PORT=7073 MOCK_TOTAL_CONVERSATIONS=120 MOCK_PAGE_DELAY_MS=3000 \
#     node e2e/pagination-mock-server.js
#
# Run: npm run test:e2e:parallel-fetch

appId: com.ronenmars.threadbase
env:
  # Metro dev-server URL as it appears in the Expo dev-client picker. Override
  # to match this machine's IP: `node e2e/run-maestro.js test -e METRO_URL=http://<ip>:8081 …`
  # (the npm script passes it for you).
  METRO_URL: http://localhost:8081
---
- runScript: scripts/reset-progress-mock.js

- launchApp:
    clearState: true
    clearKeychain: true

# 1. Dev-client picker — select Metro server
- extendedWaitUntil:
    visible: "DEVELOPMENT SERVERS"
    timeout: 10000
- tapOn: "${METRO_URL}"

# 2. Dev menu intro — tap Continue
- extendedWaitUntil:
    visible: "Continue"
    timeout: 10000
- tapOn: "Continue"

# 3. Dev tools sheet — close with X (top-right of the bottom sheet)
- extendedWaitUntil:
    visible: "Reload"
    timeout: 10000
- tapOn:
    point: "85%, 48%"

# Wait for dev tools to close before proceeding
- extendedWaitUntil:
    notVisible: "Reload"
    timeout: 5000

- runFlow:
    when:
      visible:
        id: "onboarding-welcome-cta"
    commands:
      # Step 1 / WELCOME
      - tapOn:
          id: "onboarding-welcome-cta"
      # Step 2 / CONNECT
      - tapOn:
          id: "onboarding-connect-paste-card"
      - extendedWaitUntil:
          visible:
            id: "onboarding-connect-url-input"
          timeout: 5000
      - tapOn:
          id: "onboarding-connect-url-input"
      - inputText: "http://localhost:7073"
      - extendedWaitUntil:
          visible:
            id: "onboarding-connect-token-input"
          timeout: 5000
      - tapOn:
          id: "onboarding-connect-token-input"
      - inputText: "mock-key-pagination"
      - tapOn:
          point: "50%, 20%"
      - tapOn:
          id: "onboarding-connect-handshake-cta"
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
      # Step 3 / NOTIFICATIONS
      - extendedWaitUntil:
          visible:
            id: "onboarding-notifications-cta"
          timeout: 10000
      - tapOn:
          id: "onboarding-notifications-cta"
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
      # Step 4 / DONE
      - extendedWaitUntil:
          visible:
            id: "onboarding-done-cta"
          timeout: 5000
      - tapOn:
          id: "onboarding-done-cta"

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 10000

# ── Step 1: unified loading overlay visible (sessions + conversations) ────────
# Overlay stays up until BOTH sessions and conversations are fully loaded.
# With 3000ms mock delay per page, it will be visible for many seconds.
- extendedWaitUntil:
    visible:
      id: "sessions-loading-overlay"
    timeout: 8000

- takeScreenshot: e2e/_artifacts/progress-01-loading-overlay

# ── Step 2: overlay dismisses once both fetches are complete ──────────────────
- extendedWaitUntil:
    notVisible:
      id: "sessions-loading-overlay"
    timeout: 120000

- takeScreenshot: e2e/_artifacts/progress-02-both-done

# ── Step 3: the FIRST page of conversations appears ──────────────────────────
# Only page 1 (conv-0000 … conv-0049) is fetched on load now; the rest wait for
# the user to scroll.
- extendedWaitUntil:
    visible:
      id: "conversation-row-conv-0000"
    timeout: 120000

- takeScreenshot: e2e/_artifacts/progress-03-conversations-loaded

# ── Step 4: scrolling drives the next page ───────────────────────────────────
# conv-0050 is the first row of page 2, so it can only be on screen if
# onEndReached fired and fetchNextPage resolved. If lazy pagination regresses to
# fetching page 1 only, this is the assertion that fails.
- repeat:
    times: 8
    commands:
      - scroll:
          direction: DOWN
          speed: 60

- extendedWaitUntil:
    visible:
      id: "conversation-row-conv-0050"
    timeout: 60000

- takeScreenshot: e2e/_artifacts/progress-04-second-page-loaded
