# Maestro E2E — Onboarding flow
# Requires: a running Threadbase server reachable from the device/simulator.
# Usage:
#   THREADBASE_SERVER_URL=http://192.168.x.x:7070 \
#   THREADBASE_API_KEY=your-key \
#   maestro test e2e/01_onboarding.yaml

appId: com.ronenmars.threadbase
---
- launchApp:
    clearState: true

# App should land on Onboarding when no credentials stored
- assertVisible:
    text: "Threadbase"

- assertVisible:
    text: "AI Agent Control Center"

- assertVisible:
    text: "Connect"

# Fill in server URL
- tapOn:
    placeholder: "http://localhost:7070"

- clearText

- inputText:
    text: "${THREADBASE_SERVER_URL:-http://localhost:7070}"

# Fill in API key
- tapOn:
    placeholder: "Enter THREADBASE_API_KEY"

- inputText:
    text: "${THREADBASE_API_KEY:-test-key}"

# Connect
- tapOn:
    text: "Connect"

# Should navigate to Sessions tab
- assertVisible:
    text: "Running"
    timeout: 8000
