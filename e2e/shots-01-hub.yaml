# App Store screenshot #1: hub view with sessions + projects.
# Lands on the hub via setup-demo.yaml (pairs against the Fly demo server),
# captures the hub screen as-is.
# Output: e2e/_artifacts/screenshots/shots-01-hub.png

appId: com.ronenmars.threadbase
---
- runFlow: setup-demo.yaml

- assertVisible:
    id: "hub-screen"

# Wait for the first project row to render before snapshotting — otherwise
# on a cold demo (Fly auto-stop wake-up) the screenshot fires before the
# project list paints and we get a blank dark-matrix background.
- extendedWaitUntil:
    visible:
      id: "tree-row-/home/demo/projects/threadbase-mobile"
    timeout: 10000

- takeScreenshot: e2e/_artifacts/screenshots/shots-01-hub
