# Native Liquid Glass Settings palette gallery.
#
# Captures the Settings viewport for every retained palette. The committed
# references live in e2e/visual/native-liquid-glass/settings-themes/.
#
# Requires: an iOS 26+ release-style app build with an unpaired, onboarded app
# state. Usage: node e2e/run-maestro.js test e2e/native-liquid-glass-settings-themes.yaml

appId: com.ronenmars.threadbase
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 30000
- tapOn:
    id: "hub-settings-btn"
- extendedWaitUntil:
    visible:
      id: "settings-theme-tab-dark"
    timeout: 8000
- waitForAnimationToEnd

# Dark palettes
- tapOn:
    id: "settings-theme-tab-dark"
- waitForAnimationToEnd
- tapOn:
    id: "settings-theme-dark"
- waitForAnimationToEnd
- takeScreenshot: e2e/_artifacts/screenshots/native-liquid-glass-settings-dark
- tapOn:
    id: "settings-theme-dracula"
- waitForAnimationToEnd
- takeScreenshot: e2e/_artifacts/screenshots/native-liquid-glass-settings-dracula
- tapOn:
    id: "settings-theme-catppuccin"
- waitForAnimationToEnd
- takeScreenshot: e2e/_artifacts/screenshots/native-liquid-glass-settings-catppuccin
- tapOn:
    id: "settings-theme-nord"
- waitForAnimationToEnd
- takeScreenshot: e2e/_artifacts/screenshots/native-liquid-glass-settings-nord
- tapOn:
    id: "settings-theme-oneDark"
- waitForAnimationToEnd
- takeScreenshot: e2e/_artifacts/screenshots/native-liquid-glass-settings-one-dark
- tapOn:
    id: "settings-theme-githubDark"
- waitForAnimationToEnd
- takeScreenshot: e2e/_artifacts/screenshots/native-liquid-glass-settings-primer-dark
- tapOn:
    id: "settings-theme-solarizedDark"
- waitForAnimationToEnd
- takeScreenshot: e2e/_artifacts/screenshots/native-liquid-glass-settings-solarized-dark
- tapOn:
