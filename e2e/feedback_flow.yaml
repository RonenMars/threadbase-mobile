# Maestro E2E — Help & Feedback flow
# Verifies the primary feedback journey: Settings → Help & Feedback → Report a
# bug → fill the form → confirm the diagnostics preview is present. It does NOT
# submit, so no real feedback report is ever sent.
#
# Requires: mock server running on localhost:7071
# Usage: node e2e/run-maestro.js test e2e/feedback_flow.yaml (or via npm run test:e2e:mock)

appId: com.ronenmars.threadbase
---
- runFlow: setup.yaml

# Hub is mounted — open Settings via the Gear in the header.
- assertVisible:
    id: "hub-screen"

- tapOn:
    id: "hub-settings-btn"

# Open Help & Feedback from the Help section.
# The Help section sits below Appearance, whose theme grid grew past a screen
# height, so the row is mounted but off-screen and `visible` alone never matches.
#
# `scrollUntilVisible` does NOT work here — it fails to detect the row even at
# timeout 20000 / speed 80 / visibilityPercentage 60. Two explicit swipes do
# reach it, and `assertVisible` then matches immediately, so the ScrollView and
# the testID are both fine; only Maestro's scroll-and-detect loop is not.
- swipe:
    start: 50%, 90%
    end: 50%, 20%
- swipe:
    start: 50%, 90%
    end: 50%, 20%
- assertVisible:
    id: "settings-help-feedback-row"

- tapOn:
    id: "settings-help-feedback-row"

# Landing screen — the three feedback entry points are present.
- extendedWaitUntil:
    visible:
      id: "feedback-landing-bug"
    timeout: 4000

- takeScreenshot: e2e/_artifacts/screenshots/feedback-landing

# Enter the bug-report form.
- tapOn:
    id: "feedback-landing-bug"

- extendedWaitUntil:
    visible:
      id: "feedback-description-input"
    timeout: 4000

# Type a description.
- tapOn:
    id: "feedback-description-input"
- inputText: "The tree view flickers on cold launch."

# Dismiss the keyboard before touching anything below the fold. It covers the
# diagnostics section, and Maestro will still report a tap there as COMPLETED
# while the touch actually lands on a key — the run that exposed this appended
# a stray "V" to the description instead of expanding the preview.
#
# `hideKeyboard` is deliberately not used: it is broken on Maestro 2.6.1 /
# iOS 26.x (see issue #611). Tapping an inert heading blurs the field instead.
- tapOn: "Help us squash a bug"

# The diagnostics opt-in is on by default; its preview toggle is present.
- assertVisible:
    id: "feedback-diagnostics-toggle"

# Expand the diagnostics preview to confirm the exact fields shown.
- tapOn:
    id: "feedback-diagnostics-toggle"
- assertVisible:
    id: "feedback-diagnostics-rows"

- takeScreenshot: e2e/_artifacts/screenshots/feedback-form-filled

# Intentionally stop here — we do NOT tap Send, so no report leaves the device.
