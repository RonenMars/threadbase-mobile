# Maestro E2E — the leave-session modal must land on the app homepage
#
# With the leave setting on "Ask me", pressing back on a live session opens the
# leave-session modal. Whichever of its three buttons is tapped ("Terminate" /
# "Keep running" / "Terminate when done"),
# once the action has been applied the app has to be on the homepage (the hub /
# classic / tree list at `/`) — not still on the session screen, and not on the
# conversation screen it redirects to when a session stops being live.
#
# Parameterised with `-e`:
#   LEAVE_OPTION         kill | leave | kill_on_idle
#   SESSION_MODE         new      — a session this flow starts through Browse
#                        resumed  — a session that already existed on the
#                                   streamer, opened from the hub
#   EXISTING_SESSION_ID  the pre-created session id (SESSION_MODE=resumed only)
#
# Requires a real threadbase-streamer (`npm run dev:verbose` in tb-streamer)
# reachable at E2E_MOCK_SERVER_URL, whose api_key is E2E_SERVER_TOKEN — the
# mock server has no PTY, so it cannot produce the live session this modal
# guards.
# Usage: node e2e/run-leave-nav.js

appId: com.ronenmars.threadbase
---
- runFlow: setup.yaml

- assertVisible:
    id: "hub-screen"

# --- ask on leave ----------------------------------------------------------
# A fresh install answers back with the Keep running notice, so the modal this
# flow tests only appears once the setting is switched to "Ask me". The
# settings screen's back button is native and carries no testID, so relaunch
# instead: the setting is persisted, and relaunching without clearState keeps it.
- tapOn:
    id: "hub-settings-btn"
- repeat:
    times: 4
    while:
      notVisible:
        id: "settings-session-leave-action"
    commands:
      - swipe:
          start: 50%, 90%
          end: 50%, 20%
- tapOn:
    id: "settings-session-leave-action"
- tapOn:
    id: "settings-session-leave-ask"
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 20000

# --- reach a live session -------------------------------------------------
- runFlow:
    when:
      true: ${SESSION_MODE == 'new'}
    commands:
      - tapOn:
          id: "fab-new-session"
          retryTapIfNoChange: true

      # One paired server goes straight to Browse; more show the picker.
      - runFlow:
          when:
            visible:
              id: "new-session-server-0"
          commands:
            - tapOn:
                id: "new-session-server-0"

      - extendedWaitUntil:
          visible:
            id: "browse-screen"
          timeout: 15000

      - tapOn:
          id: "browse-start-session"

      # Spawning a real agent PTY is far slower than the mock server.
      - extendedWaitUntil:
          visible:
            id: "session-detail-screen"
          timeout: 120000

- runFlow:
    when:
      true: ${SESSION_MODE == 'resumed'}
    commands:
      # The classic list collapses the live-sessions block once a server has
      # more than three sessions (app/index.tsx SESSIONS_COLLAPSE_THRESHOLD),
      # and a real streamer with history is always over it — so no session row
      # renders at all until the eyebrow is expanded.
      - extendedWaitUntil:
          visible:
            id: "live-sessions-header"
          timeout: 45000

      - runFlow:
          when:
            notVisible:
              id: "session-row-.*"
          commands:
            - tapOn:
                id: "live-sessions-header"

      # The classic list merges sessions with a long conversation history, so a
      # scroll that starts against a list with no session rows runs straight
      # past the row it is looking for and reports it missing.
      - extendedWaitUntil:
          visible:
            id: "session-row-.*"
          timeout: 30000

      - scrollUntilVisible:
          element:
            id: "session-row-${EXISTING_SESSION_ID}"
          direction: DOWN
          visibilityPercentage: 30
          timeout: 30000

      - tapOn:
          id: "session-row-${EXISTING_SESSION_ID}"

      - extendedWaitUntil:
          visible:
            id: "session-detail-screen"
          timeout: 60000

- takeScreenshot: e2e/_artifacts/screenshots/leave-nav-${SESSION_MODE}-${LEAVE_OPTION}-01-session

# --- leave the session ----------------------------------------------------
- tapOn:
    id: "screen-header-back-button"

- extendedWaitUntil:
    visible:
      id: "leave-session-modal"
    timeout: 10000

- tapOn:
    id: "leave-session-option-${LEAVE_OPTION}"

# A real streamer produces incidental failures a mock server never does (a slow
# response, a conversation whose history has been pruned), and any error
# auto-opens the recovery sheet over the hub. Close it rather than asserting
# through it — the sheet covers the hub and takes it out of the hierarchy.
- extendedWaitUntil:
    visible:
      id: "error-sheet-close"
    timeout: 5000
    optional: true

- runFlow:
    when:
      visible:
        id: "error-sheet-close"
    commands:
      - tapOn:
          id: "error-sheet-close"
      - waitForAnimationToEnd

# The whole point of the flow: whatever the action was, we end up home.
- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 20000

- takeScreenshot: e2e/_artifacts/screenshots/leave-nav-${SESSION_MODE}-${LEAVE_OPTION}-02-after

- assertVisible:
    id: "fab-new-session"

- assertNotVisible:
    id: "session-detail-screen"
