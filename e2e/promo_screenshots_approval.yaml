# Maestro promo — landing-page screenshots: approval card
# Requested by @marketing-owner for the threadbase.sh landing refresh (PR #97).
#
# Not a test. Opens the deep-linked PTY session (session-abc123), sends a
# command through the composer so it lands in the terminal scrollback, then
# fires the same command through the mock server's `__test__/gate` trigger
# (e2e/mock-server.js — nothing an e2e flow can do makes a real permission
# gate appear, since it is normally drawn by Claude and scraped from the PTY
# by the streamer) so the terminal output and the approval card show the same
# session content.
#
# Two shots, one mechanism, different prompts so they don't look identical:
#   - hero-approval-card.png: the gate next to its own terminal scrollback.
#   - card-approve.png: a second gate, tapped, showing the single-tap answer.
#
# Requires: mock server on localhost:7071 — MOCK_PORTS=7071,7072 node e2e/mock-server.js
# Usage: node scripts/record-simulator-flow.js e2e/promo_screenshots_approval.yaml
#        (or: node e2e/run-maestro.js test e2e/promo_screenshots_approval.yaml)

appId: com.ronenmars.threadbase
---
- runFlow: setup.yaml

- assertVisible:
    id: "hub-screen"

- runFlow:
    file: open-deeplink.yaml
    env:
      DEEPLINK: "threadbase:///session/session-abc123"

# Deep-linking a PTY session can also raise the "Session details failed to
# load" sheet (same native Modal as promo_screenshots_take_over.yaml). While
# it is up, iOS isolates the accessibility tree to the sheet, so
# session-detail-screen reports not-visible even though the session chrome
# is on screen. Dismiss it before asserting the destination.
- extendedWaitUntil:
    visible: ".*Close.*"
    timeout: 25000
    optional: true

- runFlow:
    when:
      visible:
        id: "error-sheet-retry-session-detail"
    commands:
      - tapOn:
          id: "error-sheet-retry-session-detail"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: ".*Close.*"
    commands:
      - tapOn:
          id: "error-sheet-close"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "session-detail-screen"
    timeout: 12000

- extendedWaitUntil:
    notVisible:
      id: "issues-indicator"
    timeout: 15000
    optional: true

- assertNotVisible:
    id: "issues-indicator"

- extendedWaitUntil:
    visible:
      id: "chat-message-input"
    timeout: 8000

# Same command on both surfaces: echoed into the terminal scrollback here,
# referenced by the gate's detail text below.
- tapOn:
    id: "chat-message-input"

- inputText: "npm run build && npm test"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "chat-send-button"
    timeout: 15000

- tapOn:
    id: "chat-send-button"

- waitForAnimationToEnd

# --- hero-approval-card: the gate next to the terminal session it belongs to
- runScript: scripts/trigger-gate-build.js

- extendedWaitUntil:
    visible:
      id: "question-card"
    timeout: 8000

- assertNotVisible:
    id: "issues-indicator"

- takeScreenshot: e2e/_artifacts/screenshots/hero-approval-card

# Answer it so the next gate isn't stacked behind an unanswered one.
- tapOn: "Yes"

- extendedWaitUntil:
    notVisible:
      id: "question-card"
    timeout: 8000

# --- card-approve: a second, plain approval card ----------------------------
- runScript: scripts/trigger-gate-approve.js

- extendedWaitUntil:
    visible:
      id: "question-card"
    timeout: 8000

- assertNotVisible:
    id: "issues-indicator"

- takeScreenshot: e2e/_artifacts/screenshots/card-approve
