# Same as setup.yaml but points at the public demo server on Fly.
# Use this when running screenshot or smoke flows against a fresh simulator
# (e.g. iPad sims for App Store submission), real devices, or any context
# where localhost:7071 is unreachable.
# Demo server: https://threadbase-demo.fly.dev — runs the real tb-streamer
# against a curated seed corpus. Deploy machinery + fixtures live in the
# tb-streamer repo at docker/ and demo-data/; see tb-streamer/docker/README.md.

appId: com.ronenmars.threadbase
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible:
        id: "onboarding-welcome-cta"
    commands:
      - tapOn:
          id: "onboarding-welcome-cta"

      - tapOn:
          id: "onboarding-theme-cta"

      - tapOn:
          id: "onboarding-valueprop-cta"

      - tapOn:
          id: "onboarding-connect-paste-card"

      - tapOn:
          id: "onboarding-connect-url-input"

      - inputText: "https://threadbase-demo.fly.dev"

      - tapOn:
          id: "onboarding-connect-token-input"

      - inputText: "tb_public_demo_reviewer_key"

      - tapOn:
          id: "onboarding-connect-handshake-cta"

      # iOS Keychain "Save Password?" sheet ALWAYS appears after the handshake
      # because the API-key field is secureTextEntry. It's a SpringBoard system
      # sheet outside the app's AX hierarchy, so text-based `tapOn: "Not Now"`
      # cannot see it, and Maestro has no first-class handler (launchApp
      # permissions only cover permission-grant alerts).
      #
      # Try tap-outside first (iOS 17+ relaxed some modal sheets to dismiss as
      # cancel on backdrop tap). The 0%,0% corner is safe: top-left of the
      # status bar, no tappable app elements there. If the sheet stays up, the
      # extendedWaitUntil below will fail and we'll know to switch tactics.
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: "0%,0%"
      - waitForAnimationToEnd:
          timeout: 1500

      - extendedWaitUntil:
          visible:
            id: "onboarding-notifications-cta"
          timeout: 12000

      - tapOn:
          id: "onboarding-notifications-cta"

      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"

      - tapOn:
          id: "onboarding-tour-cta"

      - tapOn:
          id: "onboarding-tour-cta"

      - tapOn:
          id: "onboarding-tour-cta"

      - tapOn:
          id: "onboarding-done-cta"

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 10000
