# Reusable setup flow. On first run (no stored credentials) walks the
# 7-step onboarding carousel; on subsequent runs the app lands on the hub
# directly because `expo-secure-store` survives `launchApp: clearState`.
# Either way, the flow ends with hub-screen visible.
# Requires: mock server running at E2E_MOCK_SERVER_URL (localhost:7071 by default;
# Android CI uses 10.0.2.2:7071 to reach the GitHub runner host).

appId: com.ronenmars.threadbase
---
- launchApp:
    clearState: true

# Cold Android CI boots can put a Pixel Launcher ANR over the welcome screen.
# Maestro then sees neither hub-screen nor onboarding-welcome-cta and treats
# the run as "already paired". "Close app" kills the launcher, not Threadbase.
# Run 32036081591 died that way, with Get started fully rendered underneath.
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"

# Same overlay class on Play-store AVDs: Digital Wellbeing ANRs on a cold boot
# and "Close app" kills wellbeing, not Threadbase.
- runFlow:
    when:
      visible: "Digital Wellbeing isn't responding"
    commands:
      - tapOn: "Close app"

# Give the splash time to clear before anything decides which screen this is.
# `runFlow when:` is a one-shot probe with a short window, and a cold Release
# start on a CI simulator is slower than that window: on iOS run 31930896875 the
# probe gave up at 7.8s, skipped the whole onboarding block as "already paired",
# and the flow died on hub-screen — with the welcome screen fully rendered in the
# failure screenshot 16 seconds later.
#
# Waiting on hub-screen rather than the welcome CTA is what makes this free in
# the common case: a run that really is already paired satisfies it immediately,
# and only a genuinely cold first run pays the timeout — by which point the
# carousel is up and the probe below reads it correctly.
- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 30000
    optional: true

# If the welcome step is visible, walk the onboarding carousel.
# Otherwise the app already has credentials cached and is on the hub.
- runFlow:
    when:
      visible:
        id: "onboarding-welcome-cta"
    commands:
      # Step 1 / WELCOME — "Pull a thread. Watch it weave."
      - tapOn:
          id: "onboarding-welcome-cta"

      # Step 2 / CONNECT — paste credentials, fill URL + token, handshake
      - tapOn:
          id: "onboarding-connect-paste-card"

      - tapOn:
          id: "onboarding-connect-url-input"

      - inputText: "${E2E_MOCK_SERVER_URL}"

      - pressKey: Enter

      - tapOn:
          id: "onboarding-connect-token-input"

      - inputText: "mock-key-123"

      - pressKey: Enter

      # Optional because the `pressKey: Enter` above may already have fired the
      # handshake: the token field is the only one wired to `onSubmitEditing`
      # (ServerFormFields passes it to the key input alone, with
      # returnKeyType="done"), and ConnectStep points that at handleConnect. So
      # whether this CTA is still on screen is a race with an async handshake
      # that has already started. Losing it failed `codex_parity` on Android
      # with "Element not found: onboarding-connect-handshake-cta" — after
      # `GET /api/profiles` had already succeeded. Keep the tap for the runs
      # where Enter does not submit; skip it for the runs where it did.
      - tapOn:
          id: "onboarding-connect-handshake-cta"
          optional: true

      # iOS may show a "Save Password?" dialog after secureTextEntry input.
      # The sheet is async: on iOS CI run 32110237753 the first probe skipped,
      # then the sheet covered NOTIFY so the done-cta wait failed and the rest
      # of the suite cascaded (including 07). Wait for it before Done, then
      # retry Notify in case the sheet ate the first tap.
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"

      # Step 3 / NOTIFY — the handshake advances here (OnboardingNavigator's
      # advanceAfterPair sets index 2), and tapping through keeps the flow off
      # the OS permission prompt, which Maestro cannot dismiss.
      #
      # Both commands are optional because this is not reliably the screen we
      # land on. On an Android release build the DONE screen has been observed
      # showing directly after the handshake, repeatably and on a clean install,
      # so it is not a timing artifact — but why the step is skipped there has
      # not been established, and asserting it failed every flow on a message
      # naming notifications while the real subject was pairing.
      # What the flows after this one need is a reached DONE, not a particular
      # route to it.
      - extendedWaitUntil:
          visible:
            id: "onboarding-notifications-cta"
          timeout: 8000
          optional: true

      - tapOn:
          id: "onboarding-notifications-cta"
          optional: true

      - extendedWaitUntil:
          visible: "Not Now"
          timeout: 8000
          optional: true
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"

      - extendedWaitUntil:
          visible:
            id: "onboarding-notifications-cta"
          timeout: 8000
          optional: true
      - tapOn:
          id: "onboarding-notifications-cta"
          optional: true

      # Step 4 / DONE — enter the app
      - extendedWaitUntil:
          visible:
            id: "onboarding-done-cta"
          timeout: 8000

      - tapOn:
          id: "onboarding-done-cta"

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 8000
