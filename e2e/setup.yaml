# Reusable setup flow. On first run (no stored credentials) walks the
# 7-step onboarding carousel; on subsequent runs the app lands on the hub
# directly because `expo-secure-store` survives `launchApp: clearState`.
# Either way, the flow ends with hub-screen visible.
# Requires: mock server running on localhost:7071

appId: com.ronenmars.threadbase
---
- launchApp:
    clearState: true

# If the welcome step is visible, walk the onboarding carousel.
# Otherwise the app already has credentials cached and is on the hub.
- runFlow:
    when:
      visible:
        id: "onboarding-welcome-cta"
    commands:
      # Step 1 / WELCOME — "Pull a thread. Watch it weave."
      - tapOn:
          id: "onboarding-welcome-cta"

      # Step 2 / CONNECT — paste credentials, fill URL + token, handshake
      - tapOn:
          id: "onboarding-connect-paste-card"

      - tapOn:
          id: "onboarding-connect-url-input"

      - inputText: "http://localhost:7071"

      - hideKeyboard

      - tapOn:
          id: "onboarding-connect-token-input"

      - inputText: "mock-key-123"

      - hideKeyboard

      - tapOn:
          id: "onboarding-connect-handshake-cta"

      # iOS may show a "Save Password?" dialog after secureTextEntry input
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"

      # Step 3 / DONE — handshake auto-advances here; enter the app
      - extendedWaitUntil:
          visible:
            id: "onboarding-done-cta"
          timeout: 8000

      - tapOn:
          id: "onboarding-done-cta"

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 8000
