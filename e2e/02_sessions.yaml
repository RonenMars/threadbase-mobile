# Maestro E2E — Sessions & Navigation flow
# Assumes onboarding has already been completed (credentials stored).
# Usage:
#   maestro test e2e/02_sessions.yaml

appId: com.ronenmars.threadbase
---
- launchApp

# Sessions tab should be visible
- assertVisible:
    text: "Running"

- assertVisible:
    text: "Waiting for Input"

- assertVisible:
    text: "Completed"

- assertVisible:
    text: "Failed"

# Navigate to History tab
- tapOn:
    text: "History"

- assertVisible:
    id: "history-screen"
    timeout: 3000

# Navigate to Settings tab
- tapOn:
    text: "Settings"

- assertVisible:
    text: "Disconnect"

- assertVisible:
    text: "Notifications"

# Navigate back to Sessions tab
- tapOn:
    text: "Sessions"

- assertVisible:
    text: "Running"
