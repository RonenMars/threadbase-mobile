# Marketing capture 2 — "Your coding agents have memory."
#
# Search across every paired machine's history by the problem remembered, open
# the old answer, then turn an old conversation back into a live session.
#
# Not a regression test. Run through e2e/marketing/run.sh.
appId: com.ronenmars.threadbase
---
- runFlow: setup.yaml

# --- 01: history from three machines ----------------------------------------
# scrollUntilVisible swipes from the screen centre, which on a phone at the
# default text size lands on a Working card and never moves the list.
# Swipe from the history rows on the left instead.
- repeat:
    while:
      notVisible:
        id: "conversation-row-conv-ld-onboarding"
    times: 6
    commands:
      - swipe:
          start: 25%, 85%
          end: 25%, 40%
      - waitForAnimationToEnd:
          timeout: 1500
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible:
    id: "status-pill"
- takeScreenshot: 02-agent-memory/01-history-across-sessions

# --- 02: search by the remembered problem -----------------------------------
- runFlow:
    file: search.yaml
    env:
      QUERY: "callback environment"
- extendedWaitUntil:
    visible:
      id: "conversation-row-conv-wm-auth0"
    timeout: 10000
# Hits across two machines, so the shot reads as search over every session.
# The auth-callback row backs the live wm-codex-auth session and does not show
# in search, on iOS or web, so it is not required.
- assertVisible:
    id: "conversation-row-conv-wm-auth-callback"
    optional: true
- assertVisible:
    id: "conversation-row-conv-hm-storefront-redirect"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 02-agent-memory/02-search-engineering-memory

# --- 03: the old answer ------------------------------------------------------
- tapOn:
    id: "conversation-row-conv-wm-auth0"
- extendedWaitUntil:
    visible:
      id: "search-match-count"
    timeout: 10000
- assertVisible: ".*Allowed Callback URLs.*"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 02-agent-memory/03-recovered-old-solution

- tapOn:
    id: "screen-header-back-button"
- extendedWaitUntil:
    visible:
      id: "hub-search-input"
    timeout: 10000

# --- 04: a different project, a different machine ---------------------------
- runFlow:
    file: search.yaml
    env:
      QUERY: "session persistence SQLite resume"
- extendedWaitUntil:
    visible:
      id: "conversation-row-conv-hm-sqlite"
    timeout: 10000
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 02-agent-memory/04-cross-project-search

# --- 05: Claude Code and Codex in one result list ---------------------------
- runFlow:
    file: search.yaml
    env:
      QUERY: "authentication retry"
- extendedWaitUntil:
    visible:
      id: "conversation-row-conv-wm-auth-retry"
    timeout: 10000
- assertVisible:
    id: "conversation-row-conv-hm-auth-retry"
# Marks only appear on rows that differ from the result set's majority provider.
- assertVisible:
    id: "provider-mark"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 02-agent-memory/05-cross-provider-memory

# --- 07: hero — one word, every machine --------------------------------------
# Captured before 06 because 06 leaves the search behind.
- runFlow:
    file: search.yaml
    env:
      QUERY: "session"
# Enter first: on an Android phone the keyboard covers the Linux Devbox row.
- pressKey: Enter
# The ld-search row also backs a live session, so like the auth-callback row it
# can be missing from search; wait for it, but do not fail the flow without it.
- extendedWaitUntil:
    visible:
      id: "conversation-row-conv-ld-search"
    timeout: 10000
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 02-agent-memory/07-hero

# --- 06: old work becomes live work -----------------------------------------
- tapOn:
    id: "conversation-row-conv-hm-sqlite"
- extendedWaitUntil:
    visible:
      id: "resume-button"
    timeout: 10000
- tapOn:
    id: "resume-button"
- extendedWaitUntil:
    visible:
      id: "session-detail-screen"
    timeout: 15000
- extendedWaitUntil:
    visible: "Needs you"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-agent-memory/06-history-to-active-session
