# Maestro E2E — Bubble-only live chat
#
# Verifies the bubble-only session screen (no terminal tab) with a real local
# streamer. Deep-links via hub tap to a pre-started live session.
#
# Pre-condition: a live session must exist on the server. The test uses
# SERVER_URL and API_KEY to connect, then taps the first session card.
#
# Run with:
#   maestro --device <UDID> test \
#     -e SERVER_URL=http://192.168.68.125:8766 \
#     -e "API_KEY=tb_ApAda@uHb8T2rtZ@*yf_tKMKC!G-LQXV" \
#     e2e/live-chat-tab.yaml

appId: com.ronenmars.threadbase
---
- launchApp:
    clearState: true
    clearKeychain: true

# ── Onboarding ────────────────────────────────────────────────────────────────

- waitForAnimationToEnd

- assertVisible:
    text: "Begin handshake"

- tapOn:
    text: "Begin handshake"

- waitForAnimationToEnd

- tapOn:
    id: "onboarding-connect-paste-card"

- waitForAnimationToEnd

- tapOn:
    id: "onboarding-connect-url-input"
- eraseText
- inputText: ${SERVER_URL}

- hideKeyboard
- waitForAnimationToEnd

- tapOn:
    id: "onboarding-connect-token-input"
- eraseText
- inputText: ${API_KEY}

- hideKeyboard

- tapOn:
    id: "onboarding-connect-handshake-cta"

- waitForAnimationToEnd:
    timeout: 10000

- assertNotVisible:
    text: "Connection failed"

- runFlow:
    when:
      visible:
        text: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    text: "Skip"

- waitForAnimationToEnd:
    timeout: 3000

- runFlow:
    when:
      visible:
        text: "Save Password?"
    commands:
      - tapOn:
          text: "Not Now"
      - waitForAnimationToEnd

- tapOn:
    id: "onboarding-done-cta"

- extendedWaitUntil:
    visible:
      id: "fab-new-session"
    timeout: 10000

- takeScreenshot: e2e/_artifacts/screenshots/live-chat-00-hub.png

# ── Navigate to the live session via hub ──────────────────────────────────────

- extendedWaitUntil:
    visible:
      id: "first-session-card"
    timeout: 10000

- tapOn:
    id: "first-session-card"

- extendedWaitUntil:
    visible:
      id: "session-detail-screen"
    timeout: 12000

# ── Bubble-only session screen ────────────────────────────────────────────────
# No tab bar — the terminal tab and tab-bar testIDs are gone.

- assertNotVisible:
    id: "session-tab-terminal"

- assertNotVisible:
    id: "session-tab-chat"

# Chat composer loads directly (no tab switch needed)
- extendedWaitUntil:
    visible:
      id: "chat-message-input"
    timeout: 8000

- takeScreenshot: e2e/_artifacts/screenshots/live-chat-01-composer.png

# ── Send a reply via the chat input ──────────────────────────────────────────

- tapOn:
    id: "chat-message-input"
- inputText: "Say exactly: ready"

- hideKeyboard
- waitForAnimationToEnd

- tapOn:
    id: "chat-send-button"

# Optimistic bubble appears immediately
- extendedWaitUntil:
    visible:
      text: "Say exactly: ready"
    timeout: 10000

- takeScreenshot: e2e/_artifacts/screenshots/live-chat-02-reply-sent.png

# ── Expand modal ──────────────────────────────────────────────────────────────

- tapOn:
    id: "expand-input-button"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: "message-input-expanded"

- tapOn:
    id: "message-input-expanded"
- inputText: " follow-up text"

- takeScreenshot: e2e/_artifacts/screenshots/live-chat-03-expanded-input.png

- tapOn:
    id: "minimize-input-button"

- waitForAnimationToEnd

- assertNotVisible:
    id: "message-input-expanded"

- takeScreenshot: e2e/_artifacts/screenshots/live-chat-04-minimized.png
