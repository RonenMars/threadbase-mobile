# Maestro E2E — Server drag-reorder flow
#
# Verifies the Filter & Sort sheet remains usable with the server-order UI
# mounted. The focused DisplayedServersList integration suite owns the
# multi-server edit-order interaction: switching to NestableScrollContainer
# makes the toggle inaccessible to Maestro after the first tap.
#
# Deliberately does NOT Maestro-`swipe` a drag handle. That step crashed
# the app on NestableDraggableFlatList (Bug 18). Row order after a real
# drag is covered by `__tests__/integration` for DisplayedServersList.
#
# To force the multi-server branch locally, pair a second server via
# Settings → Manage servers before running this flow.
#
# Requires: mock server running on localhost:7071
# Usage: node e2e/run-maestro.js test e2e/server_drag_reorder.yaml

appId: com.ronenmars.threadbase
---
- runFlow: setup.yaml

# Hub is mounted
- assertVisible:
    id: "hub-screen"

# Open the Filter & Sort sheet
- tapOn:
    id: "filter-sort-button"

- extendedWaitUntil:
    visible:
      id: "filter-sort-sheet"
    timeout: 5000

- takeScreenshot: e2e/_artifacts/screenshots/drag-reorder-01-server-order.png

- tapOn:
    id: "filter-sort-close-btn"
