# Non-merged History tab lazy pagination — e2e validation.
#
# Verifies that in the classic (non-merged) layout, the History tab loads
# conversations one page at a time as the list is scrolled.
#
# This flow used to assert that a conversation-only loading overlay appeared
# while conversations were fetched. That overlay can no longer appear: it is
# gated on `!hasCachedData`, and once sessions have loaded there IS cached data,
# so the blocking modal is deliberately suppressed. ADR 0001 step 2 also removed
# the `convDone` / `convLoaderMode` / `showConvProgress` state the old assertion
# depended on. What replaces it is the property that actually matters now —
# scrolling fetches the next page.
#
# Flow:
#   1. Fresh launch with clearState → onboarding → hub
#   2. Open Settings → disable "Merge sessions & history as Chats"
#   3. Back to hub → tap History tab
#   4. Assert the first page renders
#   5. Scroll, and assert a second-page row appears
#
# MOCK_TOTAL_CONVERSATIONS must exceed the query's page size (50) or there is no
# second page and step 5 cannot fail.
#
# Requires: pagination mock running on http://localhost:7073
# Run: npm run test:e2e:parallel-fetch:non-merged

appId: com.ronenmars.threadbase
env:
  # Metro dev-server URL as it appears in the Expo dev-client picker. Override
  # to match this machine's IP: `node e2e/run-maestro.js test -e METRO_URL=http://<ip>:8081 …`
  # (the npm script passes it for you).
  METRO_URL: http://localhost:8081
---
- runScript: scripts/reset-progress-mock.js

- launchApp:
    clearState: true
    clearKeychain: true

# 1. Dev-client picker — select Metro server
- extendedWaitUntil:
    visible: "DEVELOPMENT SERVERS"
    timeout: 10000
- tapOn: "${METRO_URL}"

# 2. Dev menu intro — tap Continue
- extendedWaitUntil:
    visible: "Continue"
    timeout: 10000
- tapOn: "Continue"

# 3. Dev tools sheet — close with X
- extendedWaitUntil:
    visible: "Reload"
    timeout: 10000
- tapOn:
    point: "85%, 48%"

- extendedWaitUntil:
    notVisible: "Reload"
    timeout: 5000

- runFlow:
    when:
      visible:
        id: "onboarding-welcome-cta"
    commands:
      # Step 1 / WELCOME
      - tapOn:
          id: "onboarding-welcome-cta"
      # Step 2 / CONNECT
      - tapOn:
          id: "onboarding-connect-paste-card"
      - extendedWaitUntil:
          visible:
            id: "onboarding-connect-url-input"
          timeout: 5000
      - tapOn:
          id: "onboarding-connect-url-input"
      - inputText: "http://localhost:7073"
      - extendedWaitUntil:
          visible:
            id: "onboarding-connect-token-input"
          timeout: 5000
      - tapOn:
          id: "onboarding-connect-token-input"
      - inputText: "mock-key-pagination"
      - tapOn:
          point: "50%, 20%"
      - tapOn:
          id: "onboarding-connect-handshake-cta"
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
      # Step 3 / NOTIFICATIONS
      - extendedWaitUntil:
          visible:
            id: "onboarding-notifications-cta"
          timeout: 10000
      - tapOn:
          id: "onboarding-notifications-cta"
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
      # Step 4 / DONE
      - extendedWaitUntil:
          visible:
            id: "onboarding-done-cta"
          timeout: 5000
      - tapOn:
          id: "onboarding-done-cta"

# Wait for hub-screen, then for the unified overlay to fully dismiss
# (sessions + conversations both done). Settings gear is blocked while overlay
# is up (pointerEvents="auto"), so we wait before navigating.
- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: "sessions-loading-overlay"
    timeout: 8000

- takeScreenshot: e2e/_artifacts/non-merged-01-overlay-visible

- extendedWaitUntil:
    notVisible:
      id: "sessions-loading-overlay"
    timeout: 120000

- takeScreenshot: e2e/_artifacts/non-merged-02-hub-loaded

# ── Step 2: Go to Settings → disable Merge Chats ─────────────────────────────
- tapOn:
    id: "hub-settings-btn"

- extendedWaitUntil:
    visible:
      id: "settings-merge-chats-toggle"
    timeout: 5000

- takeScreenshot: e2e/_artifacts/non-merged-03-settings

# Disable "Merge sessions & history as Chats" (it's ON by default)
- tapOn:
    id: "settings-merge-chats-toggle"

- takeScreenshot: e2e/_artifacts/non-merged-04-toggle-off

# ── Step 3: Back to hub ───────────────────────────────────────────────────────
- tapOn:
    id: "header-back"

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 5000

- takeScreenshot: e2e/_artifacts/non-merged-05-hub-non-merged

# ── Step 4: Tap History tab — the first page renders ─────────────────────────
# The History tab enables the infinite conversations query; page 1 is
# conv-0000 … conv-0049.
- extendedWaitUntil:
    visible:
      id: "hub-history-tab"
    timeout: 5000

- tapOn:
    id: "hub-history-tab"

- extendedWaitUntil:
    visible:
      id: "conversation-row-conv-0000"
    timeout: 60000

- takeScreenshot: e2e/_artifacts/non-merged-06-first-page

# ── Step 5: Scrolling fetches the next page ──────────────────────────────────
# conv-0050 is the first row of page 2 and cannot render unless onEndReached
# fired and fetchNextPage resolved.
- repeat:
    times: 8
    commands:
      - scroll:
          direction: DOWN
          speed: 60

- extendedWaitUntil:
    visible:
      id: "conversation-row-conv-0050"
    timeout: 60000

- takeScreenshot: e2e/_artifacts/non-merged-07-second-page
