# Maestro E2E — Bug 6: conversation list content hidden under bottom bar
# Verifies the FlashList in app/conversation/[id].tsx reserves enough
# paddingBottom for the Export + Resume action bar, so the last message
# is visible at rest (not behind the bar).
#
# Strategy: deeplink straight to a conversation that has many messages
# (mock fixture `conversation-detail-many.json` has 30, last one tagged
# FINAL_MESSAGE_MARKER), scroll to the bottom, then assert both the
# bottom action bar and the last message row are simultaneously visible.
#
# Requires: mock server running on localhost:7071 with the bug6 fixture
#           wired into /api/conversations/:id (see mock-server.js).
# Usage: node e2e/run-maestro.js test e2e/bug6_bottom_bar_inset.yaml

appId: com.ronenmars.threadbase
---
- runFlow: setup.yaml

# Hub is mounted — onboarding paired the mock server as activeServerIds[0].
- assertVisible:
    id: "hub-screen"

# Deeplink into the many-message conversation. No ?server= param — the
# screen falls back to activeServerIds[0], which is the freshly paired
# mock server, so the request hits localhost:7071.
- runFlow:
    file: open-deeplink.yaml
    env:
      DEEPLINK: "threadbase:///conversation/conv-many-messages"

# Bottom action bar should always be mounted on conversation screen.
- extendedWaitUntil:
    visible:
      id: "conversation-bottom-bar"
    timeout: 12000

# Scroll down until the final message row enters the viewport. The list
# auto-scrolls to bottom on mount but scrollToEnd targets contentSize
# (which includes paddingBottom); the last message itself only becomes
# fully visible if the FlashList contentContainerStyle reserves enough
# bottom padding for the action bar — this is exactly what Bug 6 fixes.
- scrollUntilVisible:
    element:
      id: "conversation-last-message"
    direction: DOWN
    timeout: 10000
    speed: 40

# Both must be visible at rest — proves the last message is NOT hidden
# behind the action bar (the regression Bug 6 reported).
- assertVisible:
    id: "conversation-last-message"
- assertVisible:
    id: "conversation-bottom-bar"

# Visual proof: the last message sits above the bottom action bar. If Bug 6
# ever regresses, the diff between this screenshot and a known-good frame
# will surface the overlap immediately.
- takeScreenshot: e2e/_artifacts/screenshots/bug6-01-last-message-above-bar.png
