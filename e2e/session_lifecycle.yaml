# Maestro E2E — Session lifecycle hub → browse entry
# Asserts the new-session FAB still opens browse (the handoff surface for
# start-session). Deep session-detail / abandon-empty paths are covered by
# Jest (sessionLifecycle + SessionScreen.holdOnBackground).
#
# Requires: mock server on localhost:7071
# Usage: node e2e/run-maestro.js test e2e/session_lifecycle.yaml

appId: com.ronenmars.threadbase
---
- runFlow: setup.yaml

- assertVisible:
    id: "hub-screen"

- assertVisible:
    id: "fab-new-session"

- tapOn:
    id: "fab-new-session"

- extendedWaitUntil:
    visible:
      id: "browse-screen"
    timeout: 8000

- assertVisible:
    id: "browse-start-session"

- takeScreenshot: e2e/_artifacts/screenshots/session-lifecycle-01-browse

# Leave browse without starting — modal dismiss must return a usable hub.
#
# `- back` does NOT work here. Browse is a `presentation: 'modal'` Stack.Screen
# (app/_layout.tsx), and iOS modals dismiss by dragging the sheet down, not by a
# back navigation. Maestro reports `- back` as COMPLETED while the modal stays
# put, so the failure surfaced as "hub-screen not visible" when the real state
# was "browse never closed" — see BACKLOG Bug 15, which records drag-down as the
# only gesture that exits this sheet.
- swipe:
    start: 50%, 12%
    end: 50%, 85%

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 8000

- assertVisible:
    id: "fab-new-session"
