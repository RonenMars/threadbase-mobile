# Maestro E2E — Session lifecycle hub → browse entry
# Asserts the new-session FAB still opens browse (the handoff surface for
# start-session). Deep session-detail / abandon-empty paths are covered by
# Jest (sessionLifecycle + SessionScreen.holdOnBackground).
#
# Requires: mock server on localhost:7071
# Usage: node e2e/run-maestro.js test e2e/session_lifecycle.yaml

appId: com.ronenmars.threadbase
---
- runFlow: setup.yaml

- assertVisible:
    id: "hub-screen"

- assertVisible:
    id: "fab-new-session"

- tapOn:
    id: "fab-new-session"

- extendedWaitUntil:
    visible:
      id: "browse-screen"
    timeout: 8000

- assertVisible:
    id: "browse-start-session"

- takeScreenshot: e2e/_artifacts/screenshots/session-lifecycle-01-browse

# Leave browse without starting — dismiss must return a usable hub.
#
# Browse is a `presentation: 'modal'` Stack.Screen (app/_layout.tsx). On iOS
# that is a sheet: `- back` reports COMPLETED and does nothing, and the only
# exit is a drag-down (BACKLOG Bug 15 / #645). On Android it is a full-screen
# activity with a back affordance, and the same drag is a no-op — run
# 32004798693 left browse-screen up and failed the trailing hub-screen assert.
# Try back first; if browse is still showing, this is the iOS sheet.
- back
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "browse-screen"
    commands:
      - swipe:
          start: 50%, 12%
          end: 50%, 85%

- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 8000

- assertVisible:
    id: "fab-new-session"
