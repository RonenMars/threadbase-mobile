# Maestro E2E — Codex CLI read parity (real streamer)
#
# Variant of codex_parity.yaml that skips clearState/onboarding and deep-links
# directly into a real codex-cli conversation served by the worktree streamer
# on localhost:8766. Requires the app already paired to the streamer (no mock).
#
# Usage: maestro test e2e/codex_parity_real.yaml

appId: com.ronenmars.threadbase
---
# Launch without wiping state so existing server credentials are preserved.
- launchApp

# If the Expo dev-client picker is showing, tap the recently-opened entry to
# connect. The picker shows "RECENTLY OPENED" and the row URL; the hub does not.
- runFlow:
    when:
      visible: "RECENTLY OPENED"
    commands:
      - tapOn: "http://192.168.68.128:8081"

# Wait for the real app — "Recents" tab is present in the classic/hub view
# but NOT in the Expo dev-client picker.
- extendedWaitUntil:
    visible: "Recents"
    timeout: 90000

# Deep-link without relaunching — openLink keeps the running process alive.
- openLink: "threadbase://conversation/019edfb6-e5b2-7762-9609-49e39f51b98c"

- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"

# Wait for conversation detail to load (60s covers initial bundle after Metro restart).
- extendedWaitUntil:
    visible:
      id: "conversation-bottom-bar"
    timeout: 60000

# codex-cli conversations must show "Can't resume", not "▶ Resume Session".
- assertNotVisible: "▶ Resume Session"
- assertVisible: "Can't resume"
# Messages must be present — the empty-state text must not appear.
- assertNotVisible: "No messages in this conversation."

# Open the info modal to verify the Provider field.
- tapOn: "Conversation info"
- assertVisible: "codex-cli"
