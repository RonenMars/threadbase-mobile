# Promo capture setup. Same as setup.yaml, but the Keychain is wiped first.
#
# expo-secure-store survives `launchApp: clearState` and even `simctl uninstall`.
# Leftover pairings (this sim had localhost:7081 plus an extra :7072) skip
# onboarding, so FAB opens the server picker instead of browse and search
# talks to a dead host. Marketing shots need a single mock on :7071.
appId: com.ronenmars.threadbase
---
- launchApp:
    clearState: true
    clearKeychain: true

# Maestro 2.8.0 on iOS throws SimctlError RECORDING_FAILED as an uncaught
# JVM exception (optional: true does not catch it) and fights simctl
# recordVideo. Android uses screenrecord, so startRecording is safe here.
# A failed assert still skips stopRecording — the Android runner also keeps
# an adb screenrecord of the whole suite.
- runFlow:
    when:
      platform: Android
    commands:
      - startRecording:
          path: promo
          optional: true

- runFlow: setup.yaml
