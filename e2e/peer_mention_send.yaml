appId: com.ronenmars.threadbase
---
# Manual flow: send a prompt that mentions a peer, and see it delivered.
# Needs a real streamer with a live Claude session named "mobile-peer-tagger"
# in /api/peers. It SENDS: the new session's Claude asks that peer to reply
# with a unique token, so a real message reaches the peer. Run it only with
# the peer's owner watching.
#
#   node e2e/run-maestro.js test e2e/peer_mention_send.yaml
#
# Starts on the hub of an app already paired with that streamer (see
# real_server_pair.yaml). The app can only show its own side: the prompt is
# echoed into the conversation. That the peer receives it is checked in the
# peer's session, which should see the token below.

- evalScript: ${output.token = 'PONG-' + Date.now()}
- tapOn:
    id: "fab-new-session"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "browse-first-directory"
- waitForAnimationToEnd
- tapOn:
    text: "Start Session Here"
- extendedWaitUntil:
    visible:
      id: "session-detail-screen"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "leave-session-modal"
    commands:
      - tapOn:
          id: "leave-session-cancel"
- tapOn:
    id: "chat-message-input"
- inputText: "ask @mobile-peer-t"
- extendedWaitUntil:
    visible:
      id: "peer-mention-row-.*"
    timeout: 8000

# One row matches: see peer_mention_spaced_name.yaml for why this is a point.
- tapOn:
    point: "50%,52%"
- assertVisible:
    id: "chat-message-input"
    text: "ask @mobile-peer-tagger.*"
- inputText: " reply with ${output.token}"
- takeScreenshot: peer-send-composed
- tapOn:
    id: "chat-send-button"
- extendedWaitUntil:
    visible: ".*${output.token}.*"
    timeout: 15000
- takeScreenshot: peer-send-sent
