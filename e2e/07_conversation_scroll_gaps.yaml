# Maestro E2E — conversation scroll-up blank gaps (regression)
#
# Repro of the paused-session bug: scrolling UP fast through a conversation
# whose rows range from ~50pt (collapsed Reasoning headers) to ~3,000pt
# (markdown-table answers) opened progressively larger blank regions, and a
# small scroll could teleport the viewport. Root causes fixed together:
#   - delta-poll off-by-one appending a duplicate-id tail row every tick
#   - FlashList drawDistance left at the 250px default vs multi-viewport rows
#   - one coarse getItemType pool poisoning the estimated-height average
#
# The flow flings to the top of the fixture conversation with NO settle time
# between gestures, then requires the top rows to be drawn within a tight
# timeout. On the pre-fix build the top region stays blank (or lands
# elsewhere) until a corrective down-scroll, so the assertions fail.
#
# Fixture: e2e/fixtures/conv-scroll-gaps.json (heights mirror the real
# session that reproduced the bug). Requires the mock server on :7071.
# Usage: node e2e/run-maestro.js test e2e/07_conversation_scroll_gaps.yaml

appId: com.ronenmars.threadbase
---
# Pairing is setup.yaml's job. This flow used to inline its own copy of it to
# avoid a `hideKeyboard` that setup.yaml no longer contains, and the copy had
# drifted: it typed the token into a form it had scrolled by hand and relied on
# the return key alone to fire the handshake. On Android that never landed — the
# mock server logged no request at all for this flow — and it failed several
# steps later on `onboarding-notifications-cta`, naming notifications while the
# real subject was pairing.
- runFlow: setup.yaml

# Deeplink straight into the fixture conversation; no ?server= param — the
# screen falls back to the freshly paired mock server.
- runFlow:
    file: open-deeplink.yaml
    env:
      DEEPLINK: "threadbase:///conversation/conv-scroll-gaps"

- extendedWaitUntil:
    visible:
      id: "conversation-bottom-bar"
    timeout: 12000

# The list is meant to open on the tail, but a multi-viewport code row in this
# fixture can fill the first paint (Android CI run 32110235453: SkillRow0… on
# screen, conversation-last-message absent from the tree). Scroll to the last
# row the same way bug6 does before the dwell that needs the tail.
- scrollUntilVisible:
    element:
      id: "conversation-last-message"
    direction: DOWN
    timeout: 10000
    speed: 40

# Dwell ~10s at the tail (slow no-op swipes at the bottom edge) so the delta
# poll runs a few ticks first — on the pre-fix client each tick appends a
# duplicate tail row, churning layout exactly like the reported live session.
- swipe:
    start: 50%, 60%
    end: 50%, 58%
    duration: 3000
- swipe:
    start: 50%, 60%
    end: 50%, 58%
    duration: 3000
- swipe:
    start: 50%, 60%
    end: 50%, 58%
    duration: 3000
- swipe:
    start: 50%, 60%
    end: 50%, 58%
    duration: 3000
- swipe:
    start: 50%, 60%
    end: 50%, 58%
    duration: 3000
- swipe:
    start: 50%, 60%
    end: 50%, 58%
    duration: 3000
- swipe:
    start: 50%, 60%
    end: 50%, 58%
    duration: 3000
- swipe:
    start: 50%, 60%
    end: 50%, 58%
    duration: 3000
- swipe:
    start: 50%, 60%
    end: 50%, 58%
    duration: 3000
- swipe:
    start: 50%, 60%
    end: 50%, 58%
    duration: 3000

# After the dwell the tail must be unchanged: the second-to-last message still
# shares the viewport with the last one. The pre-fix client has appended a
# duplicate ~330pt copy of the tail row per poll tick by now, pushing
# SPEC-MARKER off-screen — this is the deterministic duplicate-append signal.
- assertVisible:
    text: ".*SPEC-MARKER.*"
- assertVisible:
    id: "conversation-last-message"

# ── Fling gauntlet: fast upward scrolls, zero settle time ─────────────────────
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 120

# ── The render window must have kept up with the flings ───────────────────────
# Tight timeout on purpose: pre-fix, the blank region persists until a
# corrective down-scroll, so waiting longer would not help a broken build.
- extendedWaitUntil:
    visible:
      text: ".*SCROLL-GAPS-TOP-MARKER.*"
    timeout: 4000
- assertVisible:
    text: ".*TOP-NEIGHBOR-MARKER.*"

- takeScreenshot: e2e/_artifacts/screenshots/scroll-gaps-top-after-flings

# ── The `↑ Top` FAB still works after the translucent restyle ─────────────────
# It is now always mounted and faded by opacity rather than conditionally
# mounted, so "still hittable" is a real risk: an opacity-0 overlay that keeps
# `pointerEvents: auto` would swallow list touches, and one that never regains
# `auto` would stop scrolling to the top. Scroll back down past the 200pt
# threshold, then drive the whole affordance through the FAB itself.
- swipe:
    start: 50%, 80%
    end: 50%, 25%
    duration: 120
- swipe:
    start: 50%, 80%
    end: 50%, 25%
    duration: 120
- swipe:
    start: 50%, 80%
    end: 50%, 25%
    duration: 120

- extendedWaitUntil:
    visible:
      id: "conversation-scroll-top"
    timeout: 4000
- takeScreenshot: e2e/_artifacts/screenshots/scroll-gaps-top-fab-over-content
- tapOn:
    id: "conversation-scroll-top"
# CI run 33987037977 rendered the marker after this animated jump, but each
# XCTest hierarchy snapshot took 6–7s, exceeding the old 4s polling budget.
# Allow another snapshot here; the fast-fling render check above stays tight.
- extendedWaitUntil:
    visible:
      text: ".*SCROLL-GAPS-TOP-MARKER.*"
    timeout: 20000
