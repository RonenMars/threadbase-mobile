// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    // Scope JitPack to GitHub-hosted artifacts only. Without this filter Gradle
    // queries JitPack's maven-metadata.xml for every dependency — including
    // Maven Central ones like org.bouncycastle (pulled via expo-updates as a
    // version range, which forces a cross-repo version listing). A JitPack read
    // timeout on that lookup then fails the whole build.
    maven {
      url 'https://www.jitpack.io'
      content { includeGroupByRegex 'com\\.github\\..*' }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
