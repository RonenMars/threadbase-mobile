// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    // Scope JitPack to GitHub-hosted artifacts only. Without this filter Gradle
    // queries JitPack's maven-metadata.xml for every dependency — including
    // Maven Central ones like org.bouncycastle (pulled via expo-updates as a
    // version range, which forces a cross-repo version listing). A JitPack read
    // timeout on that lookup then fails the whole build.
    maven {
      url 'https://www.jitpack.io'
      content { includeGroupByRegex 'com\\.github\\..*' }
    }
  }

  // Pin Bouncy Castle to exact versions across EVERY project (not just :app).
  // expo-updates pulls bcutil-jdk15to18:1.81, which transitively requires
  // bcprov-jdk15to18 as the range [1.81,1.82). Resolving a range makes Gradle
  // list versions across all repos — including the unfiltered JitPack injected
  // by expo autolinking — whose maven-metadata.xml read-times-out and fails the
  // build. The failing classpath is :expo-updates:releaseCompileClasspath, so
  // the force must live here in allprojects, not in app/build.gradle. Forcing
  // exact versions skips version listing; both resolve directly from Maven
  // Central (where they exist at 1.81).
  configurations.all {
    resolutionStrategy {
      force "org.bouncycastle:bcprov-jdk15to18:1.81"
      force "org.bouncycastle:bcutil-jdk15to18:1.81"
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
