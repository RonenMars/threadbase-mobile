# fly.toml app configuration file for threadbase-demo.
#
# As of 2026-06-01 this container runs the real @threadbase/streamer release
# against a curated seed corpus (see Dockerfile + seed/). Memory bumped from
# 256mb to 1gb to accommodate node-pty, better-sqlite3, and the conversation
# scanner. /data is a persistent Fly volume so reviewer state survives auto-
# stop / auto-start cycles.

app = 'threadbase-demo'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = 'demo_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
