name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    # `main` for post-merge validation; `chore/bump-**` so deploy's PAT-pushed
    # version-bump branches trigger CI directly. The bump PR itself is opened
    # with GITHUB_TOKEN, whose pull_request event GitHub suppresses to avoid
    # recursion — so without this the required Lint/Type check contexts never
    # report and auto-merge blocks forever.
    branches: [main, 'chore/bump-**']
  schedule:
    # Monthly E2E run: 00:00 UTC on the 1st of each month
    - cron: '0 0 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches, but never mid-flight on main: a main
  # run is post-merge validation, and cancelling it leaves the merged commit
  # with no green record.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decide whether to skip the heavy CI work. Five jobs (Lint, Type check, Unit
  # tests, Integration tests, i18n) are enforced as required status checks by the
  # `main protection` ruleset — a ruleset, not classic branch protection, so the
  # branches/main/protection API answers "Branch not protected"; read
  # /rulesets instead. They must ALWAYS run and report success — a job
  # skipped via a job-level `if:` reports "skipped", which does NOT satisfy a
  # required check and would leave the PR un-mergeable forever. Instead each job
  # checks out (cheap, and required so the local composite action exists) and
  # then runs a single guarded `run-ci` step. When the bracketed tag `[skip-ci]`
  # is present, that one step is skipped, the job still succeeds, and the check
  # context goes green in seconds. Which sources are searched depends on the
  # event: a pull_request run sees only the PR title (head_commit is null
  # there), while a push to main sees only the head commit subject. So a
  # tagged commit inside an untagged PR does NOT skip that PR's checks — they
  # run in full, which is why a docs-only commit riding in a code PR is safe.
  # Both outcomes report success, so duration is the only reliable way to tell
  # a real run from a skipped one: a skipped job finishes in seconds, a real
  # one in minutes (as of 2026-08-02, Unit ran 68 s against 4 s skipped).
  # Compare against a run you know was skipped rather than against a number. Bracketing only stops an unbracketed
  # mention of the words from tripping the skip — writing the bracketed tag
  # itself in a PR title DOES trip it, even in prose saying the run should not
  # be skipped. The PR body is deliberately NOT searched: a PR that discusses
  # this gate (e.g. quoting the tag in a code fence, or linking the issue that
  # introduced it) would otherwise skip its own suite just by describing it —
  # PR #525 had to avoid reproducing the literal tag in its body to dodge this.
  # (The monthly e2e-maestro job is schedule-only and is intentionally not gated.)
  gate:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - id: decide
        env:
          # On pull_request, github.event.head_commit is null, so fall back to
          # the PR title. On push to main, the PR fields are empty and we use
          # the head commit message. Only the commit subject (first line) and
          # the PR title are searched — never the commit body or PR body —
          # since the tag is a title-line marker the hook writes onto the
          # subject and `gh pr create` lifts into the PR title.
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          commit_subject="${HEAD_COMMIT_MSG%%$'\n'*}"
          haystack="${commit_subject}
          ${PR_TITLE}"
          if printf '%s' "$haystack" | grep -qF -- '[skip-ci]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=CI skipped::'[skip-ci]' found in commit subject / PR title — run-ci step skipped, check reported green."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  setup:
    name: Setup
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/setup

  # ── Type-check ───────────────────────────────────────────────────────────────
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    needs: [gate, setup]
    steps:
      # Checkout is unguarded and first: the local composite action below only
      # exists on disk after the repo is checked out.
      - uses: actions/checkout@v5

      - name: Type check
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/run-ci
        with:
          run: npm run typecheck

  # ── Unit tests ───────────────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [gate, setup]
    steps:
      - uses: actions/checkout@v5

      - name: Unit tests
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/run-ci
        with:
          run: npm run test:unit -- --coverage --coverageDirectory=coverage/unit

      - name: Script tests
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/run-ci
        with:
          run: npm run test:scripts

      - name: Upload unit coverage
        uses: actions/upload-artifact@v6
        if: always() && needs.gate.outputs.skip != 'true'
        with:
          name: unit-coverage
          path: coverage/unit
          retention-days: 7

  # ── Integration tests ────────────────────────────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [gate, setup]
    steps:
      - uses: actions/checkout@v5

      - name: Integration tests
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/run-ci
        with:
          run: npm run test:integration -- --coverage --coverageDirectory=coverage/integration

      - name: Upload integration coverage
        uses: actions/upload-artifact@v6
        if: always() && needs.gate.outputs.skip != 'true'
        with:
          name: integration-coverage
          path: coverage/integration
          retention-days: 7

  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [gate, setup]
    steps:
      - uses: actions/checkout@v5

      - name: Lint
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/run-ci
        with:
          run: npm run lint

  # ── i18n ─────────────────────────────────────────────────────────────────────
  # The locale gates (`i18n-completeness`, `i18n-unused-keys`, `i18n`) live at the
  # root of `__tests__/`, so neither `test:unit` (`__tests__/unit`) nor
  # `test:integration` (`__tests__/integration`) matches them and they never ran
  # on a PR. An English-only key therefore shipped green: Type check only catches
  # a *missing key* (t() is typed against the locale JSON), never a *missing
  # translation*, which reaches users as silent English fallback mid-RTL layout.
  i18n:
    name: i18n
    runs-on: ubuntu-latest
    needs: [gate, setup]
    steps:
      - uses: actions/checkout@v5

      - name: i18n
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/run-ci
        with:
          run: npm run test:i18n

  # ── Native dependency coherence ──────────────────────────────────────────────
  # Two versions of one native module resolve fine for npm and compile fine for
  # Xcode, then abort at launch in dyld with "Symbol not found" — a pod built
  # against one version of a shared dependency against a different version of it
  # bundled. TestFlight build 173 shipped that way (expo-camera 57.0.1 against
  # expo-modules-core 57.0.7) and crashed on every launch with a green CI.
  # `expo-doctor` catches the duplicate at the npm level in seconds, on Linux;
  # `scripts/verify-dyld-symbols.sh` is the belt-and-braces check at ship time.
  native-deps:
    name: Native deps
    runs-on: ubuntu-latest
    needs: [gate, setup]
    steps:
      - uses: actions/checkout@v5

      - name: Duplicate native modules
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/run-ci
        with:
          run: npm run check:native-deps

  # ── Jest E2E (__tests__/e2e) ─────────────────────────────────────────────────
  # Seven suites under `__tests__/e2e/` had an npm script (`test:e2e`) but no
  # workflow invoked it (#535) — they were free to rot with nothing watching.
  # This job wires them in. It runs on every PR but is deliberately advisory,
  # not a required status check in the `main protection` ruleset
  # (Lint/Type check/Unit tests/Integration tests/i18n) — the repo owner's
  # decision, 2026-08-03.
  #
  # Falsifier: if this goes red on `main` for a reason unrelated to whatever
  # PR triggered it, the correct response is to investigate the suite, not
  # remove the job — that is exactly how these suites went dark the first time.
  e2e-jest:
    name: E2E jest
    runs-on: ubuntu-latest
    needs: [gate, setup]
    steps:
      - uses: actions/checkout@v5

      - name: E2E jest
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/run-ci
        with:
          run: npm run test:e2e

  # ── Maestro E2E (iOS sim, monthly schedule only) ─────────────────────────────
  # Runs once per month (00:00 UTC on the 1st) via the schedule trigger above.
  # The macOS runner + iOS app build is ~15 minutes and ~$3/run, so this acts
  # as a low-frequency regression gate rather than per-commit coverage. The
  # Jest-based E2E flow tests previously gating PRs were removed entirely.
  #
  # Only `github.event_name` is interpolated here — a GitHub-controlled context
  # value, not user input — so no command-injection surface in `run:` steps.
  # Schedule-only, so it is intentionally NOT gated by [skip-ci].
  e2e-maestro:
    name: E2E maestro (iOS)
    if: github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore iOS DerivedData cache
        uses: actions/cache@v5
        with:
          path: build/ios-ci
          key: ios-derived-v1-${{ runner.os }}-xcode26.3-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ios-derived-v1-${{ runner.os }}-xcode26.3-${{ hashFiles('package-lock.json') }}-
            ios-derived-v1-${{ runner.os }}-xcode26.3-

      - name: Select Xcode 26
        # Expo SDK 56's expo-modules-jsi Package.swift requires swift-tools 6.2,
        # which ships with Xcode 26. The macos-15 runner defaults to Xcode 16.4
        # (Swift 6.1) and rejects the package with "Could not resolve package
        # dependencies: package 'apple' is using Swift tools version 6.2.0".
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json | jq -r '.devices | to_entries | map(select(.key | contains("iOS"))) | sort_by(.key) | reverse | .[0].value | map(select(.name | test("iPhone 1[5-9]"))) | .[0].udid')
          echo "Booting simulator: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Build and install iOS app (Release)
        run: |
          # SDK 57 defaults prebuild to --clean, which would wipe the committed
          # ios/Podfile (SwiftUICore/Xcode-26 hook) and regenerate it from scratch.
          npx expo prebuild --platform ios --no-clean
          xcodebuild \
            -workspace ios/Threadbase.xcworkspace \
            -scheme Threadbase \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath build/ios-ci \
            build
          APP_PATH=$(find build/ios-ci/Build/Products/Release-iphonesimulator -name "Threadbase.app" -type d | head -1)
          xcrun simctl install booted "$APP_PATH"

      - name: Run Maestro E2E suite
        run: |
          mkdir -p e2e/_artifacts/debug e2e/_artifacts/fallback
          npm run test:e2e:mock

      - name: Capture sim screenshot + Maestro session dir on failure
        if: failure()
        run: |
          # Snapshot the booted sim so we have at least one image even if
          # Maestro wrote no per-flow debug output to e2e/_artifacts/debug.
          xcrun simctl io booted screenshot e2e/_artifacts/fallback/sim-at-failure.png || true
          # Maestro defaults to writing test session output under
          # ~/.maestro/tests/<timestamp>/. Copy the most recent session into
          # the artifact dir so commands JSON + hierarchy snapshots survive.
          LATEST=$(ls -dt ~/.maestro/tests/*/ 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            mkdir -p e2e/_artifacts/maestro-session
            cp -R "$LATEST" e2e/_artifacts/maestro-session/ || true
          fi

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-artifacts
          path: e2e/_artifacts/
          retention-days: 7
          if-no-files-found: warn
