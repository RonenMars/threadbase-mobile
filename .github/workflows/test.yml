name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Type-check ───────────────────────────────────────────────────────────────
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript
        run: npm run typecheck

  # ── Unit tests ───────────────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --coverage --coverageDirectory=coverage/unit

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/unit
          retention-days: 7

  # ── Integration tests ────────────────────────────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration -- --coverage --coverageDirectory=coverage/integration

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: coverage/integration
          retention-days: 7

  # ── E2E flow tests (Jest) ────────────────────────────────────────────────────
  e2e-flow:
    name: E2E flow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E flow tests
        run: npm run test:e2e

  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Maestro E2E (iOS sim, push to main only) ─────────────────────────────────
  # Runs only on push to main (not PRs) because the macOS runner + iOS app
  # build is ~15 minutes and ~$3/run. PRs rely on the unit/integration/Jest
  # E2E jobs above; Maestro acts as a post-merge regression gate.
  #
  # Only `github.event_name` and `github.ref` are interpolated here. Both are
  # GitHub-controlled context values, not user input — no command-injection
  # surface in the `run:` steps below.
  e2e-maestro:
    name: E2E maestro (iOS)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select Xcode 26
        # Expo SDK 56's expo-modules-jsi Package.swift requires swift-tools 6.2,
        # which ships with Xcode 26. The macos-15 runner defaults to Xcode 16.4
        # (Swift 6.1) and rejects the package with "Could not resolve package
        # dependencies: package 'apple' is using Swift tools version 6.2.0".
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json | jq -r '.devices | to_entries | map(select(.key | contains("iOS"))) | sort_by(.key) | reverse | .[0].value | map(select(.name | test("iPhone 1[5-9]"))) | .[0].udid')
          echo "Booting simulator: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Build and install iOS app (Release)
        run: |
          npx expo prebuild --platform ios --non-interactive
          xcodebuild \
            -workspace ios/Threadbase.xcworkspace \
            -scheme Threadbase \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath build/ios-ci \
            build
          APP_PATH=$(find build/ios-ci/Build/Products/Release-iphonesimulator -name "Threadbase.app" -type d | head -1)
          xcrun simctl install booted "$APP_PATH"

      - name: Run Maestro E2E suite
        run: npm run test:e2e:mock

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts
          path: e2e/_artifacts/
          retention-days: 7
