name: Deploy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to deploy'
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
          - all
      target:
        description: 'iOS target (testflight or production)'
        required: false
        default: testflight
        type: choice
        options:
          - testflight
          - production
      android_track:
        description: 'Android track'
        required: false
        default: alpha
        type: choice
        options:
          - alpha
          - internal
          - beta
          - production
      release_notes:
        description: 'Release notes (iOS production only)'
        required: false
        type: string
      deploy_ref:
        description: 'Branch/ref to build (default: main). Set to a feature branch to validate a fix before merging: the branch is built + uploaded to the store, and only the version bump is pushed to main (after a successful upload). The branch code lands on main via the PR.'
        required: false
        default: main
        type: string

jobs:
  deploy-ios:
    name: Ship iOS
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # expo-modules-jsi's Package.swift declares swift-tools-version 6.2, which
      # needs Xcode 26+. The macos-15 runner defaults to Xcode 16.4 (Swift 6.1),
      # so the archive fails at SPM resolution. Point the whole toolchain at the
      # Xcode 26.3 that's preinstalled on the image.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Warn when building a non-main ref
        if: ${{ inputs.deploy_ref != 'main' }}
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
        run: |
          echo "::warning::Building '${DEPLOY_REF}', not main (deploy_ref override)." \
               "The branch's code is built and uploaded to the store. Only the" \
               "version bump is pushed to main (after a successful upload) — the" \
               "branch's other changes land on main only when you merge the PR."

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_ref }}
          # persist-credentials lets us push the bump commit back to main
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Bootstrap iOS signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          ASC_AUTH_KEY_B64: ${{ secrets.ASC_AUTH_KEY_B64 }}
        run: |
          if [[ -f .env.signing ]] && source .env.signing 2>/dev/null && [[ -f "${ASC_KEY_PATH:-}" ]]; then
            echo "Signing already bootstrapped — skipping"
          else
            ./scripts/bootstrap-ios-signing.sh
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Install Ruby dependencies
        run: bundle install

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods
        # Not --deployment: prebuilt-artifact pods (hermes, React-Core-prebuilt,
        # ReactNativeDependencies, ExpoModulesCore) regenerate fresh checksums on
        # CI, which --deployment treats as a fatal lockfile change. Let pod install
        # update Podfile.lock in place instead of failing the build.
        run: cd ios && bundle exec pod install

      - name: Bump build number (working tree only)
        run: |
          source .env.signing
          # check-build-number.sh bumps app.json's buildNumber in the working tree
          # and exits 2 (does not commit). Exit 0 = already ahead, exit 2 = bumped,
          # anything else = real error. The bumped app.json stays in the working
          # tree so the ship step builds with the new buildNumber; the push to main
          # happens only AFTER a successful upload (see step below).
          ./scripts/check-build-number.sh && true || {
            code=$?
            [[ $code -eq 2 ]] || exit $code
          }
          # Record the resolved buildNumber so the post-ship step can re-derive the
          # bump onto main's own app.json without carrying other working-tree edits.
          echo "BUMPED_BUILD_NUMBER=$(jq -r '.expo.ios.buildNumber' app.json)" >> "$GITHUB_ENV"

      - name: Ship iOS
        env:
          IOS_TARGET: ${{ inputs.target }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          ARGS=(
            --target "$IOS_TARGET"
            --skip-git-sync
            --skip-version-check
            --skip-preflight
          )
          if [[ -n "$RELEASE_NOTES" ]]; then
            ARGS+=(--release-notes "$RELEASE_NOTES")
          fi
          ./scripts/ship-ios.sh "${ARGS[@]}"

      - name: Push build number bump to main (after successful upload)
        # Only runs if Ship iOS succeeded — so main advances only when a build
        # actually uploaded to TestFlight. Re-derives just the buildNumber onto
        # main's own app.json in a throwaway worktree, so a branch validation build
        # does NOT leak the branch's code to main — only the version bump lands.
        if: success()
        env:
          BUMPED_BUILD_NUMBER: ${{ env.BUMPED_BUILD_NUMBER }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          MAIN_BN=$(git show origin/main:app.json | jq -r '.expo.ios.buildNumber')
          if [[ "$BUMPED_BUILD_NUMBER" == "$MAIN_BN" ]]; then
            echo "main already at buildNumber $MAIN_BN — nothing to push"
            exit 0
          fi
          git worktree add /tmp/bump-main-ios origin/main
          ( cd /tmp/bump-main-ios
            jq ".expo.ios.buildNumber = \"${BUMPED_BUILD_NUMBER}\"" app.json > app.json.tmp && mv app.json.tmp app.json
            git add app.json
            git commit -m "chore(ios): bump build number to ${BUMPED_BUILD_NUMBER} [skip-ci]"
            git push origin HEAD:main
          )
          git worktree remove /tmp/bump-main-ios --force

  deploy-android:
    name: Ship Android
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Warn when building a non-main ref
        if: ${{ inputs.deploy_ref != 'main' }}
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
        run: |
          echo "::warning::Building '${DEPLOY_REF}', not main (deploy_ref override)." \
               "The branch's code is built and uploaded to the store. Only the" \
               "version bump is pushed to main (after a successful upload) — the" \
               "branch's other changes land on main only when you merge the PR."

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_ref }}
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Fetch Play credentials
        env:
          PLAY_SA_JSON_B64: ${{ secrets.PLAY_SA_JSON_B64 }}
        run: |
          # Materializes the SA JSON to the cache path ship-android.sh checks,
          # then exports its path so later steps (version check, upload) authenticate.
          CREDS_PATH="$(./scripts/fetch-play-credentials.sh)"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${CREDS_PATH}" >> "$GITHUB_ENV"

      - name: Bootstrap Android signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/bootstrap-android-signing.sh

      - name: Bump versionCode (working tree only)
        run: |
          # check-version-code.sh bumps app.json + android/app/build.gradle in the
          # working tree and exits 2 (does not commit). Exit 0 = already ahead,
          # exit 2 = bumped, anything else = real error. The bumped files stay in
          # the working tree so the ship step builds with the new versionCode; the
          # push to main happens only AFTER a successful upload (see step below).
          ./scripts/check-version-code.sh && true || {
            code=$?
            [[ $code -eq 2 ]] || exit $code
          }
          # Record the resolved versionCode so the post-ship step can re-derive the
          # bump onto main's own files without carrying any other working-tree edits.
          echo "BUMPED_VERSION_CODE=$(jq -r '.expo.android.versionCode' app.json)" >> "$GITHUB_ENV"

      - name: Ship Android
        env:
          ANDROID_TRACK: ${{ inputs.android_track }}
        run: |
          ./scripts/ship-android.sh \
            --track "$ANDROID_TRACK" \
            --skip-git-sync \
            --skip-version-check \
            --skip-preflight

      - name: Push versionCode bump to main (after successful upload)
        # Only runs if Ship Android succeeded — so main advances only when a build
        # actually consumed a versionCode on Play. Re-derives just the version
        # number onto main's own files in a throwaway worktree, so a branch
        # validation build does NOT leak the branch's code (e.g. build.gradle
        # edits) to main — only the version bump lands.
        if: success()
        env:
          BUMPED_VERSION_CODE: ${{ env.BUMPED_VERSION_CODE }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          MAIN_VC=$(git show origin/main:app.json | jq -r '.expo.android.versionCode')
          if [[ "$BUMPED_VERSION_CODE" == "$MAIN_VC" ]]; then
            echo "main already at versionCode $MAIN_VC — nothing to push"
            exit 0
          fi
          git worktree add /tmp/bump-main origin/main
          ( cd /tmp/bump-main
            jq ".expo.android.versionCode = ${BUMPED_VERSION_CODE}" app.json > app.json.tmp && mv app.json.tmp app.json
            GRADLE_VC=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | grep -oE '[0-9]+')
            sed "s/versionCode ${GRADLE_VC}/versionCode ${BUMPED_VERSION_CODE}/" android/app/build.gradle > android/app/build.gradle.tmp
            mv android/app/build.gradle.tmp android/app/build.gradle
            git add app.json android/app/build.gradle
            git commit -m "chore(android): bump version code to ${BUMPED_VERSION_CODE} [skip-ci]"
            git push origin HEAD:main
          )
          git worktree remove /tmp/bump-main --force
