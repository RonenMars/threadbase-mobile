name: Deploy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to deploy'
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
          - all
      target:
        description: 'iOS target (testflight or production)'
        required: false
        default: testflight
        type: choice
        options:
          - testflight
          - production
      android_track:
        description: 'Android track'
        required: false
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_notes:
        description: 'Release notes (iOS production only)'
        required: false
        type: string

jobs:
  deploy-ios:
    name: Ship iOS
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # expo-modules-jsi's Package.swift declares swift-tools-version 6.2, which
      # needs Xcode 26+. The macos-15 runner defaults to Xcode 16.4 (Swift 6.1),
      # so the archive fails at SPM resolution. Point the whole toolchain at the
      # Xcode 26.3 that's preinstalled on the image.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Warn if triggered from a non-main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        env:
          TRIGGERED_REF: ${{ github.ref }}
        run: |
          echo "::warning::This workflow was triggered from '${TRIGGERED_REF}', not main." \
               "The build always uses main (ref: main is hardcoded)." \
               "If you intended to ship code from this branch, merge it to main first."

      - uses: actions/checkout@v5
        with:
          ref: main
          # persist-credentials lets us push the bump commit back to main
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Bootstrap iOS signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          ASC_AUTH_KEY_B64: ${{ secrets.ASC_AUTH_KEY_B64 }}
        run: |
          if [[ -f .env.signing ]] && source .env.signing 2>/dev/null && [[ -f "${ASC_KEY_PATH:-}" ]]; then
            echo "Signing already bootstrapped — skipping"
          else
            ./scripts/bootstrap-ios-signing.sh
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Install Ruby dependencies
        run: bundle install

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods
        # Not --deployment: prebuilt-artifact pods (hermes, React-Core-prebuilt,
        # ReactNativeDependencies, ExpoModulesCore) regenerate fresh checksums on
        # CI, which --deployment treats as a fatal lockfile change. Let pod install
        # update Podfile.lock in place instead of failing the build.
        run: cd ios && bundle exec pod install

      - name: Bump build number → commit → push to main
        run: |
          source .env.signing
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # check-build-number.sh bumps app.json's buildNumber in the working tree
          # and exits 2 (does not commit). Exit 0 = already ahead, exit 2 = bumped,
          # anything else = real error.
          ./scripts/check-build-number.sh && true || {
            code=$?
            [[ $code -eq 2 ]] || exit $code
          }
          # Commit the bump and push to main only if it actually changed app.json.
          # On CI the bump commit lands directly on main (no PR needed).
          if git diff --quiet -- app.json; then
            echo "No buildNumber bump — nothing to commit"
          else
            git add app.json
            git commit -m "chore(ios): bump build number [skip-ci]"
            git push origin main
          fi

      - name: Ship iOS
        env:
          IOS_TARGET: ${{ inputs.target }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          ARGS=(
            --target "$IOS_TARGET"
            --skip-git-sync
            --skip-version-check
            --skip-preflight
          )
          if [[ -n "$RELEASE_NOTES" ]]; then
            ARGS+=(--release-notes "$RELEASE_NOTES")
          fi
          ./scripts/ship-ios.sh "${ARGS[@]}"

  deploy-android:
    name: Ship Android
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Warn if triggered from a non-main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        env:
          TRIGGERED_REF: ${{ github.ref }}
        run: |
          echo "::warning::This workflow was triggered from '${TRIGGERED_REF}', not main." \
               "The build always uses main (ref: main is hardcoded)." \
               "If you intended to ship code from this branch, merge it to main first."

      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Fetch Play credentials
        env:
          PLAY_SA_JSON_B64: ${{ secrets.PLAY_SA_JSON_B64 }}
        run: |
          # Materializes the SA JSON to the cache path ship-android.sh checks,
          # then exports its path so later steps (version check, upload) authenticate.
          CREDS_PATH="$(./scripts/fetch-play-credentials.sh)"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${CREDS_PATH}" >> "$GITHUB_ENV"

      - name: Bootstrap Android signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/bootstrap-android-signing.sh

      - name: Bump versionCode → commit → push to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # check-version-code.sh auto-bumps app.json and commits (exit 2) if local ≤ remote.
          # Exit 0 = already ahead, exit 2 = bumped, anything else = error.
          ./scripts/check-version-code.sh && true || {
            code=$?
            [[ $code -eq 2 ]] || exit $code
          }
          if git diff --quiet origin/main HEAD; then
            echo "No bump commit — nothing to push"
          else
            git push origin main
          fi

      - name: Ship Android
        env:
          ANDROID_TRACK: ${{ inputs.android_track }}
        run: |
          ./scripts/ship-android.sh \
            --track "$ANDROID_TRACK" \
            --skip-git-sync \
            --skip-version-check \
            --skip-preflight
