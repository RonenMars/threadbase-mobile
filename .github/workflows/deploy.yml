name: Deploy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to deploy'
        required: true
        default: all
        type: choice
        options:
          - ios
          - android
          - all
      target:
        description: 'iOS target (testflight or production)'
        required: false
        default: testflight
        type: choice
        options:
          - testflight
          - production
      android_track:
        description: 'Android track'
        required: false
        default: alpha
        type: choice
        options:
          - alpha
          - internal
          - beta
          - production
      release_notes:
        description: 'Release notes (iOS production only)'
        required: false
        type: string
      deploy_ref:
        description: 'Branch, tag, or commit SHA to build (default: main). Set to a feature branch or a snapshot tag (see CLAUDE.md → Rollup / Snapshot Tag Naming) to validate a build before merging: the ref is built + uploaded to the store, and only the version bump lands on main (via an auto-merged PR, after a successful upload). A branch''s other code lands on main via its own PR; a tag is a pinned snapshot with no separate PR.'
        required: false
        default: main
        type: string

jobs:
  deploy-ios:
    name: Ship iOS
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      # expo-modules-jsi's Package.swift declares swift-tools-version 6.2, which
      # needs Xcode 26+. The macos-15 runner defaults to Xcode 16.4 (Swift 6.1),
      # so the archive fails at SPM resolution. Point the whole toolchain at the
      # Xcode 26.3 that's preinstalled on the image.
      # Xcode 26.3's Swift 6 compiler also hits an abs() overload-ambiguity bug in
      # expo-modules-jsi (patched via patches/expo-modules-jsi+*.patch — see Expo
      # issue #47875). Expo's real fix is Xcode 26.4, not preinstalled on macos-15
      # yet; bump this to 26.4 and drop the patch once the runner image has it.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Warn when building a non-main ref
        if: ${{ inputs.deploy_ref != 'main' }}
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
        run: |
          echo "::warning::Building '${DEPLOY_REF}', not main (deploy_ref override)." \
               "The ref's code is built and uploaded to the store. Only the" \
               "version bump lands on main via an auto-merged PR (after a successful" \
               "upload) — a branch's other changes land on main only when its own PR is" \
               "merged; a tag is a pinned snapshot with no separate PR."

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_ref }}
          # persist-credentials lets us push the version-bump branch
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bootstrap iOS signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          ASC_AUTH_KEY_B64: ${{ secrets.ASC_AUTH_KEY_B64 }}
          IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_B64 }}
          IOS_PROVISION_PROFILE_UUID: ${{ secrets.IOS_PROVISION_PROFILE_UUID }}
          IOS_WIDGET_PROVISION_PROFILE_B64: ${{ secrets.IOS_WIDGET_PROVISION_PROFILE_B64 }}
          IOS_WIDGET_PROVISION_PROFILE_UUID: ${{ secrets.IOS_WIDGET_PROVISION_PROFILE_UUID }}
        run: ./scripts/bootstrap-ios-signing.sh

      - name: Install npm dependencies
        run: npm ci

      - name: Install Ruby dependencies
        run: bundle install

      - name: Cache CocoaPods
        id: pods-cache
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}

      - name: Install CocoaPods
        # Not --deployment: prebuilt-artifact pods (hermes, React-Core-prebuilt,
        # ReactNativeDependencies, ExpoModulesCore) regenerate fresh checksums on
        # CI, which --deployment treats as a fatal lockfile change. Let pod install
        # update Podfile.lock in place instead of failing the build.
        #
        # No restore-keys fallback: either both lockfiles match (full hit, Pods/ is
        # fully consistent) or we cold-install. A partial hit would allow a stale
        # Pods/Local Podspecs when node_modules changed, causing "changed version" errors.
        run: cd ios && bundle exec pod install

      - name: Validate and bump version + build number (working tree only)
        run: |
          source .env.signing
          # check-build-number.sh compares app.json version + buildNumber against
          # the latest ASC build, picks the higher version and (max+1) buildNumber,
          # updates app.json in the working tree, and exits 2 (does not commit).
          # Exit 0 = already correct, exit 2 = bumped, anything else = real error.
          # The updated app.json stays in the working tree so the ship step builds
          # with the resolved values; the push to main happens only AFTER a
          # successful upload (see step below).
          ./scripts/check-build-number.sh && true || {
            code=$?
            [[ $code -eq 2 ]] || exit $code
          }
          # Record both resolved values so the post-ship step can re-derive the
          # bump onto main's own app.json without carrying other working-tree edits.
          echo "BUMPED_BUILD_NUMBER=$(jq -r '.expo.ios.buildNumber' app.json)" >> "$GITHUB_ENV"
          echo "BUMPED_VERSION=$(jq -r '.expo.version' app.json)" >> "$GITHUB_ENV"

      - name: Ship iOS
        env:
          IOS_TARGET: ${{ inputs.target }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          IOS_PROVISION_PROFILE_UUID: ${{ secrets.IOS_PROVISION_PROFILE_UUID }}
          IOS_WIDGET_PROVISION_PROFILE_UUID: ${{ secrets.IOS_WIDGET_PROVISION_PROFILE_UUID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          ARGS=(
            --target "$IOS_TARGET"
            --skip-git-sync
            --skip-version-check
            --skip-preflight
          )
          if [[ -n "$RELEASE_NOTES" ]]; then
            ARGS+=(--release-notes "$RELEASE_NOTES")
          fi
          set +e
          ./scripts/ship-ios.sh "${ARGS[@]}"
          SHIP_EXIT=$?
          set -e
          # Exit 137 = poll-build timeout after 30 min (expected, build already uploaded)
          if (( SHIP_EXIT == 137 )); then
            echo "✓ Build uploaded to App Store Connect (polling timed out at 30 min)"
          elif (( SHIP_EXIT != 0 )); then
            exit $SHIP_EXIT
          fi

      - name: Open version + build number bump PR to main (after successful upload)
        # Only runs if Ship iOS succeeded — so main advances only when a build
        # actually uploaded to TestFlight. Re-derives version/buildNumber (and
        # any Podfile.lock drift from pod install) onto main's own tree in a
        # throwaway worktree, so a branch validation build does NOT leak the
        # branch's code to main — only the bump (+ lockfile) lands.
        # Direct pushes to main are blocked by the ruleset (required status
        # checks), so the bump lands via an admin squash-merge with the PAT
        # (admin repo role bypasses the ruleset). --auto is unreliable because
        # bot/PAT pushes do not always create the required Lint/Type check
        # contexts, so we merge with --admin immediately and fail the job if
        # the merge is refused (empty/mis-scoped GH_PAT, etc.).
        if: success()
        env:
          BUMPED_BUILD_NUMBER: ${{ env.BUMPED_BUILD_NUMBER }}
          BUMPED_VERSION: ${{ env.BUMPED_VERSION }}
          # Push, create the PR, and admin-merge all with the PAT. Creating the PR
          # with GITHUB_TOKEN makes github-actions[bot] the author, which GitHub
          # gates behind manual workflow approval.
          GH_PUSH_TOKEN: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_PUSH_TOKEN:-}" ]]; then
            echo "::error::secrets.GH_PAT is empty — cannot admin-merge the version bump onto main"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin main
          MAIN_BN=$(git show origin/main:app.json | jq -r '.expo.ios.buildNumber')
          MAIN_VER=$(git show origin/main:app.json | jq -r '.expo.version')
          NEED_VERSION=0
          NEED_LOCK=0
          if [[ "$BUMPED_BUILD_NUMBER" != "$MAIN_BN" || "$BUMPED_VERSION" != "$MAIN_VER" ]]; then
            NEED_VERSION=1
          fi
          # Preserve lockfile drift from this job's pod install (land-version-bump
          # is a no-op in CI, so the working tree still holds it).
          if [[ -n "$(git status --short ios/Podfile.lock)" ]]; then
            NEED_LOCK=1
            cp ios/Podfile.lock /tmp/podfile.lock.shipped
          fi
          echo "::group::iOS bump: resolved vs main"
          echo "  shipped version:     $BUMPED_VERSION (main: $MAIN_VER)"
          echo "  shipped buildNumber: $BUMPED_BUILD_NUMBER (main: $MAIN_BN)"
          echo "  NEED_VERSION=$NEED_VERSION  NEED_LOCK=$NEED_LOCK"
          echo "::endgroup::"
          {
            echo "## iOS version bump"
            echo ""
            echo "| Field | Shipped | main |"
            echo "|-------|---------|------|"
            echo "| version | \`$BUMPED_VERSION\` | \`$MAIN_VER\` |"
            echo "| buildNumber | \`$BUMPED_BUILD_NUMBER\` | \`$MAIN_BN\` |"
            echo ""
            echo "\`NEED_VERSION=$NEED_VERSION\`  \`NEED_LOCK=$NEED_LOCK\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( NEED_VERSION == 0 && NEED_LOCK == 0 )); then
            echo "main already at version $MAIN_VER, buildNumber $MAIN_BN — nothing to do"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "main already up to date — no bump PR opened." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="chore/bump-ios-version-${BUMPED_BUILD_NUMBER}"
          TITLE="chore(ios): bump build number to ${BUMPED_BUILD_NUMBER} [skip-ci]"
          echo "  bump branch: $BRANCH"
          echo "  bump title:  $TITLE"
          git worktree add /tmp/bump-main-ios origin/main
          ( cd /tmp/bump-main-ios
            if (( NEED_VERSION )); then
              jq ".expo.version = \"${BUMPED_VERSION}\" | .expo.ios.buildNumber = \"${BUMPED_BUILD_NUMBER}\"" \
                app.json > app.json.tmp && mv app.json.tmp app.json
              git add app.json
            fi
            if (( NEED_LOCK )); then
              cp /tmp/podfile.lock.shipped ios/Podfile.lock
              git add ios/Podfile.lock
            fi
            git commit -m "$TITLE"
            git push --force origin "HEAD:refs/heads/${BRANCH}"
          )
          git worktree remove /tmp/bump-main-ios --force
          # Shared admin-merge: create PR (GITHUB_TOKEN) then squash-merge with
          # GH_PUSH_TOKEN / GH_PAT so the admin role bypasses required checks.
          # Older deploy_ref trees may lack the helper; take it from main then.
          if [[ ! -f scripts/admin-merge-pr.sh ]]; then
            git checkout origin/main -- scripts/admin-merge-pr.sh
          fi
          ./scripts/admin-merge-pr.sh "$BRANCH" "$TITLE" \
            "Automated version bump after successful TestFlight upload (build ${BUMPED_BUILD_NUMBER})."
          echo "✓ version bump merged to main (build ${BUMPED_BUILD_NUMBER})"

      - name: Ensure tag-release action present (from main)
        # The composite action is resolved from the checked-out tree. A deploy_ref
        # branch that predates this action wouldn't contain it, so materialize the
        # actions dir from origin/main before the local `uses:` below. Runs only
        # for non-main builds; building main already has it checked out.
        if: ${{ success() && inputs.deploy_ref != 'main' }}
        run: |
          git fetch origin main
          git checkout origin/main -- .github/actions

      - name: Tag + GitHub Release (iOS)
        if: success()
        uses: ./.github/actions/tag-release
        with:
          platform: ios
          version: ${{ env.BUMPED_BUILD_NUMBER }}
          label: iOS build
          github-token: ${{ github.token }}

  deploy-android:
    name: Ship Android
    needs: [deploy-ios]
    if: ${{ always() && (inputs.platform == 'android' || inputs.platform == 'all') && (needs.deploy-ios.result == 'success' || needs.deploy-ios.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Warn when building a non-main ref
        if: ${{ inputs.deploy_ref != 'main' }}
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
        run: |
          echo "::warning::Building '${DEPLOY_REF}', not main (deploy_ref override)." \
               "The ref's code is built and uploaded to the store. Only the" \
               "version bump lands on main via an auto-merged PR (after a successful" \
               "upload) — a branch's other changes land on main only when its own PR is" \
               "merged; a tag is a pinned snapshot with no separate PR."

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_ref }}
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Fetch Play credentials
        env:
          PLAY_SA_JSON_B64: ${{ secrets.PLAY_SA_JSON_B64 }}
        run: |
          # Materializes the SA JSON to the cache path ship-android.sh checks,
          # then exports its path so later steps (version check, upload) authenticate.
          CREDS_PATH="$(./scripts/fetch-play-credentials.sh)"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${CREDS_PATH}" >> "$GITHUB_ENV"

      - name: Bootstrap Android signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/bootstrap-android-signing.sh

      - name: Set git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync app.json version from main (picks up any iOS bump)
        # When platform=all, iOS may have landed a version bump on main (via
        # auto-merged PR) after this job checked out. Pull the latest app.json
        # from origin/main so check-version-code.sh sees the updated expo.version
        # before resolving. Best-effort: if the iOS bump PR hasn't merged yet,
        # check-version-code.sh still resolves versionCode against Play directly.
        if: ${{ inputs.platform == 'all' }}
        run: |
          git fetch origin main
          git checkout origin/main -- app.json

      - name: Validate and bump versionCode + versionName (working tree only)
        run: |
          # check-version-code.sh compares app.json versionCode + versionName
          # against the latest Play build, picks max/max+1, updates app.json +
          # build.gradle in the working tree, and exits 2 (does not commit).
          # Exit 0 = already correct, exit 2 = bumped, anything else = real error.
          ./scripts/check-version-code.sh && true || {
            code=$?
            [[ $code -eq 2 ]] || exit $code
          }
          # Record both resolved values so the post-ship step can re-derive the
          # bump onto main's own files without carrying any other working-tree edits.
          echo "BUMPED_VERSION_CODE=$(jq -r '.expo.android.versionCode' app.json)" >> "$GITHUB_ENV"
          echo "BUMPED_VERSION_NAME=$(jq -r '.expo.version' app.json)" >> "$GITHUB_ENV"

      - name: Ship Android
        env:
          ANDROID_TRACK: ${{ inputs.android_track }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          ./scripts/ship-android.sh \
            --track "$ANDROID_TRACK" \
            --skip-git-sync \
            --skip-version-check \
            --skip-preflight

      - name: Open versionCode + versionName bump PR to main (after successful upload)
        # Only runs if Ship Android succeeded — so main advances only when a build
        # actually consumed a versionCode on Play. Re-derives just the version
        # fields onto main's own files in a throwaway worktree, so a branch
        # validation build does NOT leak the branch's code to main.
        # Direct pushes to main are blocked by the ruleset (required status
        # checks), so the bump lands via an admin squash-merge with the PAT
        # (admin repo role bypasses the ruleset). --auto is unreliable because
        # bot/PAT pushes do not always create the required Lint/Type check
        # contexts, so we merge with --admin immediately and fail the job if
        # the merge is refused (empty/mis-scoped GH_PAT, etc.).
        if: success()
        env:
          BUMPED_VERSION_CODE: ${{ env.BUMPED_VERSION_CODE }}
          BUMPED_VERSION_NAME: ${{ env.BUMPED_VERSION_NAME }}
          # Push, create the PR, and admin-merge all with the PAT. Creating the PR
          # with GITHUB_TOKEN makes github-actions[bot] the author, which GitHub
          # gates behind manual workflow approval.
          GH_PUSH_TOKEN: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_PUSH_TOKEN:-}" ]]; then
            echo "::error::secrets.GH_PAT is empty — cannot admin-merge the version bump onto main"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin main
          MAIN_VC=$(git show origin/main:app.json | jq -r '.expo.android.versionCode')
          MAIN_VN=$(git show origin/main:app.json | jq -r '.expo.version')
          echo "::group::Android bump: resolved vs main"
          echo "  shipped versionName: $BUMPED_VERSION_NAME (main: $MAIN_VN)"
          echo "  shipped versionCode: $BUMPED_VERSION_CODE (main: $MAIN_VC)"
          echo "::endgroup::"
          {
            echo "## Android version bump"
            echo ""
            echo "| Field | Shipped | main |"
            echo "|-------|---------|------|"
            echo "| versionName | \`$BUMPED_VERSION_NAME\` | \`$MAIN_VN\` |"
            echo "| versionCode | \`$BUMPED_VERSION_CODE\` | \`$MAIN_VC\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BUMPED_VERSION_CODE" == "$MAIN_VC" && "$BUMPED_VERSION_NAME" == "$MAIN_VN" ]]; then
            echo "main already at versionCode $MAIN_VC, versionName $MAIN_VN — nothing to do"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "main already up to date — no bump PR opened." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="chore/bump-android-version-${BUMPED_VERSION_CODE}"
          TITLE="chore(android): bump version code to ${BUMPED_VERSION_CODE} [skip-ci]"
          echo "  bump branch: $BRANCH"
          echo "  bump title:  $TITLE"
          git worktree add /tmp/bump-main origin/main
          ( cd /tmp/bump-main
            jq ".expo.version = \"${BUMPED_VERSION_NAME}\" | .expo.android.versionCode = ${BUMPED_VERSION_CODE}" \
              app.json > app.json.tmp && mv app.json.tmp app.json
            GRADLE_VC=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | grep -oE '[0-9]+')
            sed "s/versionCode ${GRADLE_VC}/versionCode ${BUMPED_VERSION_CODE}/" android/app/build.gradle > android/app/build.gradle.tmp
            mv android/app/build.gradle.tmp android/app/build.gradle
            GRADLE_VN=$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | grep -oE '"[^"]+"' | tr -d '"')
            if [[ -n "$GRADLE_VN" && "$GRADLE_VN" != "$BUMPED_VERSION_NAME" ]]; then
              sed "s/versionName \"${GRADLE_VN}\"/versionName \"${BUMPED_VERSION_NAME}\"/" android/app/build.gradle > android/app/build.gradle.tmp
              mv android/app/build.gradle.tmp android/app/build.gradle
            fi
            git add app.json android/app/build.gradle
            git commit -m "$TITLE"
            git push --force origin "HEAD:refs/heads/${BRANCH}"
          )
          git worktree remove /tmp/bump-main --force
          # Shared admin-merge: create PR (GITHUB_TOKEN) then squash-merge with
          # GH_PUSH_TOKEN / GH_PAT so the admin role bypasses required checks.
          # Older deploy_ref trees may lack the helper; take it from main then.
          if [[ ! -f scripts/admin-merge-pr.sh ]]; then
            git checkout origin/main -- scripts/admin-merge-pr.sh
          fi
          ./scripts/admin-merge-pr.sh "$BRANCH" "$TITLE" \
            "Automated version bump after successful Play upload (versionCode ${BUMPED_VERSION_CODE})."
          echo "✓ version bump merged to main (versionCode ${BUMPED_VERSION_CODE})"

      - name: Ensure tag-release action present (from main)
        # The composite action is resolved from the checked-out tree. A deploy_ref
        # branch that predates this action wouldn't contain it, so materialize the
        # actions dir from origin/main before the local `uses:` below. Runs only
        # for non-main builds; building main already has it checked out.
        if: ${{ success() && inputs.deploy_ref != 'main' }}
        run: |
          git fetch origin main
          git checkout origin/main -- .github/actions

      - name: Tag + GitHub Release (Android)
        if: success()
        uses: ./.github/actions/tag-release
        with:
          platform: android
          version: ${{ env.BUMPED_VERSION_CODE }}
          label: Android versionCode
          github-token: ${{ github.token }}
