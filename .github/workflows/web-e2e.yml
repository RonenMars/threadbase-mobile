name: Web E2E

# Playwright smoke tests for the Expo Web app (chromium only), run against the
# static export and e2e/mock-server.js. Deliberately NOT a required check and
# not in the `main protection` ruleset; reassess after two weeks of green runs.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'services/**'
      - 'stores/**'
      - 'hooks/**'
      - 'lib/**'
      - 'types/**'
      - 'locales/**'
      - 'app.json'
      - 'metro.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'e2e/web/**'
      - 'e2e/mock-server.js'
      - 'e2e/fixtures/**'
      - '.github/workflows/web-e2e.yml'
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium and system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system dependencies only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Export the web build
        run: npm run web:export

      - name: Run Playwright smoke tests
        run: npm run test:e2e:web

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-e2e-artifacts
          path: e2e/_artifacts/web/
          if-no-files-found: ignore
