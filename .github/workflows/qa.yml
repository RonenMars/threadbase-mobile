name: QA (Firebase)

# Builds an enforced-tracking QA binary with scripts/ship-qa.sh and hands it to
# Firebase App Distribution. Kept apart from deploy.yml on purpose: the enforced
# flag is inlined into the bundle, and the store workflow must never carry it.
#
# ship-qa.sh runs here only because GitHub-hosted runners are discarded after the
# job, so Metro's transform cache (not keyed on EXPO_PUBLIC_* values) cannot leak
# the flag into a later store build. Never add a cache of Metro's cache to this
# workflow, and never move it to a self-hosted runner.

# Same correlation-id convention as deploy.yml, so the dashboard can find the run.
run-name: >-
  QA ${{ inputs.deploy_ref || github.ref_name }}${{ inputs.correlation_id && format(' [{0}]', inputs.correlation_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: all
        type: choice
        options:
          - ios
          - android
          - all
      deploy_ref:
        description: 'Branch, tag, or commit SHA to build (default: main)'
        required: false
        default: main
        type: string
      groups:
        description: 'Firebase tester group aliases, comma-separated'
        required: false
        default: qa
        type: string
      release_notes:
        description: 'Release notes (default: the ref and short SHA)'
        required: false
        type: string
      correlation_id:
        description: 'Opaque id echoed into run-name so the dashboard can link to this run. Leave blank when running manually.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  GOOGLE_CLOUD_QUOTA_PROJECT: ${{ vars.GCP_PROJECT_ID }}

jobs:
  qa-ios:
    name: QA iOS
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Same pinned toolchain as deploy.yml; see the note there.
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: Checkout application source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_ref }}

      - name: Checkout shipping tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          path: .ship-workflow
          persist-credentials: false

      - name: Exclude shipping tooling from application git status
        run: echo '/.ship-workflow/' >> .git/info/exclude

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Bootstrap iOS signing (Ad Hoc profiles)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          ASC_AUTH_KEY_B64: ${{ secrets.ASC_AUTH_KEY_B64 }}
          IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_B64: ${{ secrets.IOS_ADHOC_PROFILE_B64 }}
          IOS_WIDGET_PROVISION_PROFILE_B64: ${{ secrets.IOS_WIDGET_ADHOC_PROFILE_B64 }}
        run: |
          # The UUIDs come from the profiles themselves, so re-uploading a profile
          # after registering a device is the only secret to change.
          uuid_of() {
            printf '%s' "$1" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -
          }
          IOS_PROVISION_PROFILE_UUID="$(uuid_of "$IOS_PROVISION_PROFILE_B64")"
          IOS_WIDGET_PROVISION_PROFILE_UUID="$(uuid_of "$IOS_WIDGET_PROVISION_PROFILE_B64")"
          export IOS_PROVISION_PROFILE_UUID IOS_WIDGET_PROVISION_PROFILE_UUID
          ./.ship-workflow/scripts/bootstrap-ios-signing.sh

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          # The script needs only the access token. The credentials file lands
          # untracked in the checkout, so the build identified itself as -dirty.
          create_credentials_file: false
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_SERVICE_ACCOUNT }}

      - name: Install npm dependencies
        run: npm ci

      - name: Install Ruby dependencies
        run: bundle install

      # Pods hold no JS bundle, so sharing deploy.yml's cache entry is safe.
      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}

      - name: Build and distribute
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          TESTER_GROUPS: ${{ inputs.groups }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          FIREBASE_APP_ID_IOS: ${{ vars.FIREBASE_APP_ID_IOS }}
          FIREBASE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
          EXPO_PUBLIC_FEEDBACK_EMAIL: ${{ vars.EXPO_PUBLIC_FEEDBACK_EMAIL }}
        run: |
          ./.ship-workflow/scripts/ship-qa.sh --platform ios \
            --groups "$TESTER_GROUPS" \
            --release-notes "${RELEASE_NOTES:-QA ${DEPLOY_REF} ($(git rev-parse --short HEAD))}"

      - name: Summarize deployed source and changelog
        shell: bash
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref || github.ref_name }}
        run: |
          deployed_sha="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          changelog_diff="$RUNNER_TEMP/qa-changelog.diff"
          git diff --no-ext-diff "$main_sha" "$deployed_sha" -- 'CHANGELOG*' 'changelog*' > "$changelog_diff"
          # Backticks format Markdown and must remain literal.
          # shellcheck disable=SC2016
          {
            printf '## Deployed QA source\n\n'
            printf -- '- Branch / tag / requested SHA: `%s`\n' "$DEPLOY_REF"
            printf -- '- Deployed commit: [`%s`](%s/%s/commit/%s)\n' "$deployed_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$deployed_sha"
            printf -- '- Compared with main: [`%s`](%s/%s/commit/%s)\n\n' "$main_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$main_sha"
            printf '### CHANGELOG diff from main\n\n'
            if [[ -s "$changelog_diff" ]]; then
              printf '````diff\n'
              cat "$changelog_diff"
              printf '\n````\n'
            elif { git ls-tree --name-only "$main_sha"; git ls-tree --name-only "$deployed_sha"; } | grep -E '^(CHANGELOG|changelog)' > /dev/null; then
              printf 'No CHANGELOG differences from main.\n'
            else
              printf 'No CHANGELOG file exists in main or the deployed commit.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  qa-android:
    name: QA Android
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout application source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_ref }}

      - name: Checkout shipping tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          path: .ship-workflow
          persist-credentials: false

      - name: Exclude shipping tooling from application git status
        run: echo '/.ship-workflow/' >> .git/info/exclude

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Bootstrap Android signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./.ship-workflow/scripts/bootstrap-android-signing.sh

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          # The script needs only the access token. The credentials file lands
          # untracked in the checkout, so the build identified itself as -dirty.
          create_credentials_file: false
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_SERVICE_ACCOUNT }}

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          # The file Deploy uses. It must also carry the TbDev client, or the
          # google-services plugin has no match for the .dev package.
          if [[ -z "$GOOGLE_SERVICES_JSON_B64" ]]; then
            echo "::error::GOOGLE_SERVICES_JSON_B64 is not set; the build would ship without Android push."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          jq -e 'any(.client[]; .client_info.android_client_info.package_name == "com.ronenmars.threadbase.dev")' android/app/google-services.json > /dev/null

      - name: Install npm dependencies
        run: npm ci

      - name: Build and distribute
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          TESTER_GROUPS: ${{ inputs.groups }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          FIREBASE_APP_ID_ANDROID: ${{ vars.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
          EXPO_PUBLIC_FEEDBACK_EMAIL: ${{ vars.EXPO_PUBLIC_FEEDBACK_EMAIL }}
        run: |
          ./.ship-workflow/scripts/ship-qa.sh --platform android \
            --groups "$TESTER_GROUPS" \
            --release-notes "${RELEASE_NOTES:-QA ${DEPLOY_REF} ($(git rev-parse --short HEAD))}"

      - name: Summarize deployed source and changelog
        shell: bash
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref || github.ref_name }}
        run: |
          deployed_sha="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          changelog_diff="$RUNNER_TEMP/qa-changelog.diff"
          git diff --no-ext-diff "$main_sha" "$deployed_sha" -- 'CHANGELOG*' 'changelog*' > "$changelog_diff"
          # Backticks format Markdown and must remain literal.
          # shellcheck disable=SC2016
          {
            printf '## Deployed QA source\n\n'
            printf -- '- Branch / tag / requested SHA: `%s`\n' "$DEPLOY_REF"
            printf -- '- Deployed commit: [`%s`](%s/%s/commit/%s)\n' "$deployed_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$deployed_sha"
            printf -- '- Compared with main: [`%s`](%s/%s/commit/%s)\n\n' "$main_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$main_sha"
            printf '### CHANGELOG diff from main\n\n'
            if [[ -s "$changelog_diff" ]]; then
              printf '````diff\n'
              cat "$changelog_diff"
              printf '\n````\n'
            elif { git ls-tree --name-only "$main_sha"; git ls-tree --name-only "$deployed_sha"; } | grep -E '^(CHANGELOG|changelog)' > /dev/null; then
              printf 'No CHANGELOG differences from main.\n'
            else
              printf 'No CHANGELOG file exists in main or the deployed commit.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
