name: E2E

# Maestro E2E (Android by default, with an iOS option). Two ways in:
#
#   * Monthly schedule — 00:00 UTC on the 1st, the low-frequency regression gate
#     this suite has always been. It lived in `test.yml` until this workflow
#     existed; it moved here so E2E has one home rather than two.
#   * Manual dispatch — run it against any branch, tag, commit SHA, or open PR
#     number. Defaults to `main`.
#
# The Android Release build is still expensive enough that this is never wired
# to `pull_request`: per-commit E2E would cost more than it catches. Dispatch it
# by hand when a change actually touches a flow.
#
#   gh workflow run E2E                       # main, whole mock suite
#   gh workflow run E2E -f ref=572            # PR #572's head
#   gh workflow run E2E -f ref=my/branch      # a branch
#   gh workflow run E2E -f ref=v1.2.3         # a tag
#   gh workflow run E2E -f platform=ios        # iOS instead of the default Android
#   gh workflow run E2E -f flows=e2e/codex_parity.yaml            # one flow
#   gh workflow run E2E -f ref=572 -f flows="e2e/a.yaml e2e/b.yaml"
#
# Narrowing `flows` used to skip no setup — the Release build was the expensive
# part and ran inside the emulator step every time. The APK is now cached per
# checked-out SHA, and assembleRelease runs *before* the emulator boots. A
# second dispatch of the same commit (a one-flow warmup, then the rest) reuses
# that APK and only pays emulator boot + Maestro. The first dispatch of a new
# SHA still compiles.
#
# Two independent selectors, easy to confuse:
#
#   * `--ref` (the UI's "Use workflow from") picks which branch's copy of THIS
#     file runs. It defaults to the default branch, which is why an unqualified
#     dispatch runs main's definition — but it is not a restriction. Point it at
#     a branch to test a change to this workflow before merging it.
#   * `-f ref=` picks the *code under test*, independent of the above.
#
#   gh workflow run E2E --ref my/branch -f ref=my/branch   # this file AND the code from my/branch
#
# Both dispatches of a warmup-then-rest split must use the same `--ref`:
# Actions cache is scoped to that branch, and `--ref` also selects this file.
#
#   gh workflow run E2E --ref my/branch -f ref=my/branch -f flows=e2e/launch.yaml
#   gh workflow run E2E --ref my/branch -f ref=my/branch -f flows="e2e/a.yaml e2e/b.yaml"
#
# `workflow_dispatch` must exist on the default branch for the trigger to be
# offered at all; once it is, any branch's version can be run.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to test'
        required: false
        default: 'android'
        type: choice
        options:
          - android
          - ios
      ref:
        description: 'Branch, tag, commit SHA, or PR number to test (default: main)'
        required: false
        default: 'main'
        type: string
      flows:
        description: 'Space-separated flow files, e.g. "e2e/codex_parity.yaml" (default: the whole mock suite)'
        required: false
        default: ''
        type: string
  schedule:
    # Monthly E2E run: 00:00 UTC on the 1st of each month
    - cron: '0 0 1 * *'

concurrency:
  # One E2E at a time per target — two runs would fight over the same emulator.
  group: e2e-${{ inputs.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  e2e-maestro:
    name: E2E maestro
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'ios' && 'macos-15' || 'ubuntu-24.04' }}
    # 75m was enough when the iOS Release cache was warm (~39m build + ~19m
    # Maestro). A cold DerivedData miss (run 32161343357) spent ~57m on the
    # build and was cancelled at 75m with the suite still running.
    timeout-minutes: 120
    steps:
      # `ref` is the one piece of attacker-controllable input in this workflow,
      # so it is validated here and never interpolated into a `run:` script —
      # it reaches the shell through the environment and leaves as a step
      # output, which `actions/checkout` takes as a parameter rather than as
      # code. A bare digit string means a PR: `refs/pull/N/head` is the PR's own
      # commit, which is what you want to smoke-test (unlike `/merge`, it exists
      # even when the PR has conflicts with its base).
      - name: Resolve ref
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$INPUT_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
            echo "::error::Refusing ref '$INPUT_REF' — expected a branch, tag, SHA, or PR number."
            exit 1
          fi
          if printf '%s' "$INPUT_REF" | grep -Eq '^[0-9]+$'; then
            RESOLVED="refs/pull/$INPUT_REF/head"
          else
            RESOLVED="$INPUT_REF"
          fi
          echo "ref=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Testing $RESOLVED" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      # github.sha is the commit that *triggered* the workflow (`--ref`), which
      # is the workflow file's branch and is not always the code under test
      # (`-f ref=`). The APK cache must follow the checked-out tree.
      - name: Record checked-out SHA
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'ios' && '22' || '24.15.0' }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v5
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'android' }}
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'android' }}

      # cache-read-only defaults to true off `main`, which would make a feature-
      # branch warmup unable to seed the next dispatch on that same branch.
      - uses: gradle/actions/setup-gradle@v5
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'android' }}
        with:
          cache-read-only: false

      # Restore a previously built APK for this exact commit. No restore-keys:
      # a prefix match would install a different SHA's binary. The cache is
      # scoped to the workflow's branch (`--ref`), so both dispatches must use
      # the same `--ref` (typically the branch under test).
      - name: Cache Android Release APK
        id: apk-cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'android' }}
        uses: actions/cache@v5
        with:
          path: android/app/build/outputs/apk/release/app-release.apk
          key: e2e-android-apk-v1-${{ runner.os }}-x86_64-${{ steps.head.outputs.sha }}

      # Assemble before the emulator boots so a 20-minute compile does not hold
      # a live emulator idle. That idle window is what made later Maestro flows
      # die with `device offline`. A cache hit skips this step entirely.
      - name: Assemble Android Release APK
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.platform == 'android') && steps.apk-cache.outputs.cache-hit != 'true' }}
        env:
          REACT_NATIVE_ARCHITECTURES: x86_64
          TB_MOBILE_UPLOAD_KEYSTORE: ${{ github.workspace }}/android/app/debug.keystore
          TB_MOBILE_UPLOAD_KEYSTORE_PASSWORD: android
          TB_MOBILE_UPLOAD_KEY_ALIAS: androiddebugkey
          TB_MOBILE_UPLOAD_KEY_PASSWORD: android
          SENTRY_DISABLE_AUTO_UPLOAD: true
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures="${REACT_NATIVE_ARCHITECTURES:-x86_64}"

      - name: Note APK cache hit
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.platform == 'android') && steps.apk-cache.outputs.cache-hit == 'true' }}
        env:
          TEST_SHA: ${{ steps.head.outputs.sha }}
        run: echo "Reusing cached Release APK for $TEST_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Maestro CLI
        run: |
          MAESTRO_VERSION=$(node -p "require('./e2e/maestro-version.json').version")
          MAESTRO_VERSION="$MAESTRO_VERSION" curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      # ubuntu-24.04 ships /dev/kvm but leaves it root-owned, so without this rule
      # the emulator silently falls back to software emulation. Run
      # [31851391066](https://github.com/RonenMars/threadbase-mobile/actions/runs/31851391066)
      # took 744 seconds to boot that way and then died at `adb shell input
      # keyevent 82` with `Broken pipe (32)` and exit code 224 — the emulator's
      # system_server was still not serving binder calls when the action's own
      # post-boot unlock ran, before any of the script below executed. With KVM
      # the boot is ~1 minute and those calls land on a settled system.
      - name: Enable KVM
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'android' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # This action installs the Android emulator, platform tools, API 35 SDK,
      # and Google APIs x86_64 image, then waits for the one requested emulator
      # to finish booting before it runs the script below.
      - name: Install APK and run Maestro on Android API 35
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'android' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FLOWS: ${{ inputs.flows }}
          E2E_PLATFORM: android
          E2E_ANDROID_API_LEVEL: '35'
          E2E_MOCK_SERVER_URL: http://10.0.2.2:7071
          # Simulator-only release signing: use the repository's debug key, not
          # production signing material. Production deploys keep their own path.
          TB_MOBILE_UPLOAD_KEYSTORE: ${{ github.workspace }}/android/app/debug.keystore
          TB_MOBILE_UPLOAD_KEYSTORE_PASSWORD: android
          TB_MOBILE_UPLOAD_KEY_ALIAS: androiddebugkey
          TB_MOBILE_UPLOAD_KEY_PASSWORD: android
          # The app bundles Sentry, but E2E must never require upload credentials.
          SENTRY_DISABLE_AUTO_UPLOAD: true
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          # android-emulator-runner runs `script` under /usr/bin/sh (dash on
          # ubuntu), which rejects `set -o pipefail`. Hand the body to bash.
          # One line on purpose: android-emulator-runner runs each line of
          # `script` as its own `sh -c`, so a multi-line body is not a script.
          # See the header of e2e/run-android-ci.sh.
          script: bash e2e/run-android-ci.sh

      - uses: ruby/setup-ruby@v1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'ios' }}
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Restore iOS DerivedData cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'ios' }}
        uses: actions/cache@v5
        with:
          path: build/ios-ci
          key: ios-derived-v1-${{ runner.os }}-xcode26.3-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ios-derived-v1-${{ runner.os }}-xcode26.3-${{ hashFiles('package-lock.json') }}-
            ios-derived-v1-${{ runner.os }}-xcode26.3-

      - name: Select Xcode 26
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'ios' }}
        # Expo SDK 56's expo-modules-jsi Package.swift requires swift-tools 6.2,
        # which ships with Xcode 26. The macos-15 runner defaults to Xcode 16.4
        # (Swift 6.1) and rejects the package with "Could not resolve package
        # dependencies: package 'apple' is using Swift tools version 6.2.0".
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Boot iOS simulator
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'ios' }}
        run: |
          DEVICE=$(xcrun simctl list devices available --json | jq -r '.devices | to_entries | map(select(.key | contains("iOS"))) | sort_by(.key) | reverse | .[0].value | map(select(.name | test("iPhone 1[5-9]"))) | .[0].udid')
          echo "Booting simulator: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Install CocoaPods
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'ios' }}
        # `ios/` is committed, so `expo prebuild` reports "reusing /ios" and skips
        # the CocoaPods step entirely — leaving a CI checkout with no `ios/Pods/`
        # and an xcodebuild that dies on a missing `Pods-Threadbase.release
        # .xcconfig`. Prebuild first (it can rewrite the pbxproj), then install
        # pods against the result. No `--deployment`: prebuilt-artifact pods
        # regenerate fresh checksums on CI, which `--deployment` rejects.
        run: |
          npx expo prebuild --platform ios --no-clean
          (cd ios && bundle exec pod install)
          ./scripts/reset-podfile-lock-path-noise.sh

      # E2E has no use for uploaded source maps and no Sentry secrets, but the
      # Sentry config plugin injects a sentry-cli phase into every Release build
      # and that phase exits 65 without credentials — killing the job ~90 seconds
      # into the compile, before any Maestro flow runs. `development` skips the
      # upload; deploy.yml stays on the strict default.
      - name: Resolve app env (skips the Sentry source-map upload)
        env:
          APP_ENV: development
        run: ./scripts/check-sentry-env.sh >> "$GITHUB_ENV"

      - name: Build and install iOS app (Release)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'ios' }}
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: true
        run: |
          xcodebuild \
            -workspace ios/Threadbase.xcworkspace \
            -scheme Threadbase \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath build/ios-ci \
            build
          APP_PATH=$(find build/ios-ci/Build/Products/Release-iphonesimulator -name "Threadbase.app" -type d | head -1)
          xcrun simctl install booted "$APP_PATH"

      - name: Run Maestro E2E suite on iOS
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'ios' }}
        env:
          FLOWS: ${{ inputs.flows }}
          # Tells e2e/ensure-release-build.js that the step above already built
          # and installed the Release app. Without it the script cannot find a
          # build under `-derivedDataPath build/ios-ci` and rebuilds from
          # scratch with `expo run:ios`, which never returns.
          E2E_PLATFORM: ios
        run: |
          set -euo pipefail
          mkdir -p e2e/_artifacts/debug e2e/_artifacts/fallback
          if [ -z "$FLOWS" ]; then
            npm run test:e2e:mock
            exit 0
          fi
          for f in $FLOWS; do
            case "$f" in
              e2e/*.yaml) ;;
              *) echo "::error::Refusing flow '$f' — expected a path like e2e/<name>.yaml."; exit 1 ;;
            esac
            if [ ! -f "$f" ]; then
              echo "::error::No such flow: $f"
              exit 1
            fi
          done
          echo "Running flows: $FLOWS" >> "$GITHUB_STEP_SUMMARY"
          node e2e/check-sim.js
          node e2e/ensure-release-build.js
          MOCK_PORTS=7071,7072 node e2e/mock-server.js &
          MOCK_PID=$!
          sleep 1
          set +e
          node e2e/run-maestro.js test --debug-output e2e/_artifacts/debug --test-output-dir e2e/_artifacts/maestro-output $FLOWS
          STATUS=$?
          set -e
          kill "$MOCK_PID" 2>/dev/null || true
          exit $STATUS

      # No Android counterpart to the iOS step below: `android-emulator-runner`
      # kills the emulator when its own step ends, so anything running here has
      # no device left to photograph. The equivalent capture lives in
      # `e2e/run-android-ci.sh`'s EXIT trap, which runs inside that step while
      # the emulator is still up. A duplicate step here did not merely fail —
      # `adb exec-out screencap -p > file` truncates its target before adb
      # errors out, so it overwrote the trap's good screenshot with zero bytes.
      # That is what run 31904637356 uploaded: an empty PNG and nothing else.

      - name: Capture iOS simulator screenshot on failure
        if: ${{ failure() && github.event_name == 'workflow_dispatch' && inputs.platform == 'ios' }}
        run: xcrun simctl io booted screenshot e2e/_artifacts/fallback/sim-at-failure.png || true

      - name: Copy Maestro session dir on failure
        if: failure()
        run: |
          LATEST=$(ls -dt ~/.maestro/tests/*/ 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            mkdir -p e2e/_artifacts/maestro-session
            cp -R "$LATEST" e2e/_artifacts/maestro-session/ || true
          fi

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-artifacts
          path: e2e/_artifacts/
          retention-days: 7
          if-no-files-found: warn

  notify-schedule-failure:
    name: Notify on scheduled E2E failure
    needs: e2e-maestro
    # `failure()` is true only when a needed job (e2e-maestro) actually failed —
    # not when it's cancelled, and not when it's skipped. Combined with the
    # event_name check, this only fires for the monthly cron: a workflow_dispatch
    # run has someone watching it live, so it doesn't need a push alert. A
    # scheduled run has no PR to report into, which is the blind spot this job
    # closes — see docs/followups/repo-health/01-scheduled-run-notifications.md.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      # CI_ALERT_WEBHOOK is unset until a channel (Slack/Discord/ntfy/etc.) is
      # chosen — see docs/deploy-failure-notifications-plan.md. Until then this
      # step is a clean no-op so a missing secret never fails the run.
      - name: Send alert
        env:
          WEBHOOK_URL: ${{ secrets.CI_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::notice::CI_ALERT_WEBHOOK secret not set — skipping notification. See docs/deploy-failure-notifications-plan.md to configure a channel."
            exit 0
          fi
          # GitHub context values are passed through env: above and referenced
          # here as shell variables, then handed to jq -n --arg — never
          # string-interpolated straight into a shell-quoted JSON body, which is
          # a workflow-injection vector the repo's PostToolUse hook flags.
          PAYLOAD=$(jq -n --arg t "E2E scheduled run failed: $WORKFLOW_NAME — $RUN_URL" '{text: $t}')
          curl -sf -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
