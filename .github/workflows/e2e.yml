name: E2E

# Maestro E2E (Android by default, with an iOS option). Two ways in:
#
#   * Weekly schedule — 00:00 UTC every Sunday, covering Android and iOS
#     this suite has always been. It lived in `test.yml` until this workflow
#     existed; it moved here so E2E has one home rather than two.
#   * Manual dispatch — run it against any branch, tag, commit SHA, or open PR
#     number. Defaults to `main`.
#
# The Release build is still expensive enough that this is never wired to
# `pull_request`: per-commit E2E would cost more than it catches. Dispatch it
# by hand when a change actually touches a flow.
#
# Default full-suite shape: one build job per platform, then parallel Maestro
# shards that reuse that binary. Android is three emulator VMs after one APK
# job; iOS is two simulator VMs after one xcodebuild. A `flows` input collapses
# to a single shard so a one-flow rerun does not pay three emulators.
#
#   gh workflow run E2E                       # main, whole mock suite
#   gh workflow run E2E -f ref=572            # PR #572's head
#   gh workflow run E2E -f ref=my/branch      # a branch
#   gh workflow run E2E -f ref=v1.2.3         # a tag
#   gh workflow run E2E -f platform=ios        # iOS instead of the default Android
#   gh workflow run E2E -f flows=e2e/codex_parity.yaml            # one flow
#   gh workflow run E2E -f ref=572 -f flows="e2e/a.yaml e2e/b.yaml"
#
# The APK / iOS .app is cached per checked-out SHA (and uploaded as an artifact
# to the shards in the same run). A second dispatch of the same commit reuses
# that binary and only pays emulator/simulator boot + Maestro.
#
# Two independent selectors, easy to confuse:
#
#   * `--ref` (the UI's "Use workflow from") picks which branch's copy of THIS
#     file runs. It defaults to the default branch, which is why an unqualified
#     dispatch runs main's definition — but it is not a restriction. Point it at
#     a branch to test a change to this workflow before merging it.
#   * `-f ref=` picks the *code under test*, independent of the above.
#
#   gh workflow run E2E --ref my/branch -f ref=my/branch   # this file AND the code from my/branch
#
# Actions cache is scoped to the workflow's branch (`--ref`), so a warmup and a
# later dispatch of the same commit must use the same `--ref`.
#
# `workflow_dispatch` must exist on the default branch for the trigger to be
# offered at all; once it is, any branch's version can be run.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to test'
        required: false
        default: 'android'
        type: choice
        options:
          - android
          - ios
      ref:
        description: 'Branch, tag, commit SHA, or PR number to test (default: main)'
        required: false
        default: 'main'
        type: string
      flows:
        description: 'Space-separated flow files, e.g. "e2e/codex_parity.yaml" (default: the whole mock suite)'
        required: false
        default: ''
        type: string
  schedule:
    # Weekly E2E run: 00:00 UTC every Sunday
    - cron: '0 0 * * 0'

concurrency:
  # One E2E workflow run at a time per target. Matrix shards in a single run
  # are separate VMs and do not share an emulator; two *dispatches* of the
  # same ref still serialize so a warmup and a full suite cannot clobber
  # each other's cache writes.
  group: e2e-${{ inputs.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve E2E target
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      android-shards: ${{ steps.plan.outputs.android-shards }}
      ios-shards: ${{ steps.plan.outputs.ios-shards }}
    steps:
      # `ref` is the one piece of attacker-controllable input in this workflow,
      # so it is validated here and never interpolated into a `run:` script —
      # it reaches the shell through the environment and leaves as a step
      # output, which `actions/checkout` takes as a parameter rather than as
      # code. A bare digit string means a PR: `refs/pull/N/head` is the PR's own
      # commit, which is what you want to smoke-test (unlike `/merge`, it exists
      # even when the PR has conflicts with its base).
      - name: Resolve ref
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$INPUT_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
            echo "::error::Refusing ref '$INPUT_REF' — expected a branch, tag, SHA, or PR number."
            exit 1
          fi
          if printf '%s' "$INPUT_REF" | grep -Eq '^[0-9]+$'; then
            RESOLVED="refs/pull/$INPUT_REF/head"
          else
            RESOLVED="$INPUT_REF"
          fi
          echo "ref=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Testing $RESOLVED" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Plan shards
        id: plan
        env:
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_FLOWS: ${{ inputs.flows }}
        run: node e2e/mock-suite-shards.js

  android-apk:
    name: Android APK
    needs: resolve
    if: ${{ needs.resolve.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      # github.sha is the commit that *triggered* the workflow (`--ref`), which
      # is the workflow file's branch and is not always the code under test
      # (`-f ref=`). The APK cache must follow the checked-out tree.
      - name: Record checked-out SHA
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      # cache-read-only defaults to true off `main`, which would make a feature-
      # branch warmup unable to seed the next dispatch on that same branch.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      # Restore a previously built APK for this exact commit. No restore-keys:
      # a prefix match would install a different SHA's binary. The cache is
      # scoped to the workflow's branch (`--ref`), so both dispatches must use
      # the same `--ref` (typically the branch under test).
      - name: Cache Android Release APK
        id: apk-cache
        uses: actions/cache@v5
        with:
          path: android/app/build/outputs/apk/release/app-release.apk
          key: e2e-android-apk-v1-${{ runner.os }}-x86_64-${{ steps.head.outputs.sha }}

      # Assemble before any emulator boots so a 20-minute compile does not hold
      # a live emulator idle. That idle window is what made later Maestro flows
      # die with `device offline`. A cache hit skips this step entirely.
      - name: Assemble Android Release APK
        if: ${{ steps.apk-cache.outputs.cache-hit != 'true' }}
        env:
          REACT_NATIVE_ARCHITECTURES: x86_64
          TB_MOBILE_UPLOAD_KEYSTORE: ${{ github.workspace }}/android/app/debug.keystore
          TB_MOBILE_UPLOAD_KEYSTORE_PASSWORD: android
          TB_MOBILE_UPLOAD_KEY_ALIAS: androiddebugkey
          TB_MOBILE_UPLOAD_KEY_PASSWORD: android
          SENTRY_DISABLE_AUTO_UPLOAD: true
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures="${REACT_NATIVE_ARCHITECTURES:-x86_64}"

      - name: Note APK cache hit
        if: ${{ steps.apk-cache.outputs.cache-hit == 'true' }}
        env:
          TEST_SHA: ${{ steps.head.outputs.sha }}
        run: echo "Reusing cached Release APK for $TEST_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v6
        with:
          name: e2e-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  android-maestro:
    name: E2E maestro (android ${{ matrix.shard }}/${{ matrix.total }})
    needs: [resolve, android-apk]
    if: ${{ needs.resolve.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.android-shards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Android Release APK
        uses: actions/download-artifact@v6
        with:
          name: e2e-android-apk
          path: android/app/build/outputs/apk/release

      - name: Install Maestro CLI
        run: |
          MAESTRO_VERSION=$(node -p "require('./e2e/maestro-version.json').version")
          curl -fsSL "https://get.maestro.mobile.dev" | env MAESTRO_VERSION="$MAESTRO_VERSION" bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          INSTALLED_MAESTRO_VERSION=$(MAESTRO_CLI_NO_ANALYTICS=1 "$HOME/.maestro/bin/maestro" --version | tail -n 1)
          if [ "$INSTALLED_MAESTRO_VERSION" != "$MAESTRO_VERSION" ]; then
            echo "::error::Expected Maestro $MAESTRO_VERSION, installed $INSTALLED_MAESTRO_VERSION."
            exit 1
          fi
          echo "Maestro $INSTALLED_MAESTRO_VERSION"

      # ubuntu-24.04 ships /dev/kvm but leaves it root-owned, so without this rule
      # the emulator silently falls back to software emulation. Run
      # [31851391066](https://github.com/RonenMars/threadbase-mobile/actions/runs/31851391066)
      # took 744 seconds to boot that way and then died at `adb shell input
      # keyevent 82` with `Broken pipe (32)` and exit code 224 — the emulator's
      # system_server was still not serving binder calls when the action's own
      # post-boot unlock ran, before any of the script below executed. With KVM
      # the boot is ~1 minute and those calls land on a settled system.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # This action installs the Android emulator, platform tools, API 35 SDK,
      # and Google APIs x86_64 image, then waits for the one requested emulator
      # to finish booting before it runs the script below.
      - name: Install APK and run Maestro on Android API 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FLOWS: ${{ matrix.flows }}
          E2E_PLATFORM: android
          E2E_ANDROID_API_LEVEL: '35'
          E2E_MOCK_SERVER_URL: http://10.0.2.2:7071
          # Simulator-only release signing: use the repository's debug key, not
          # production signing material. Production deploys keep their own path.
          TB_MOBILE_UPLOAD_KEYSTORE: ${{ github.workspace }}/android/app/debug.keystore
          TB_MOBILE_UPLOAD_KEYSTORE_PASSWORD: android
          TB_MOBILE_UPLOAD_KEY_ALIAS: androiddebugkey
          TB_MOBILE_UPLOAD_KEY_PASSWORD: android
          # The app bundles Sentry, but E2E must never require upload credentials.
          SENTRY_DISABLE_AUTO_UPLOAD: true
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          # android-emulator-runner runs `script` under /usr/bin/sh (dash on
          # ubuntu), which rejects `set -o pipefail`. Hand the body to bash.
          # One line on purpose: android-emulator-runner runs each line of
          # `script` as its own `sh -c`, so a multi-line body is not a script.
          # See the header of e2e/run-android-ci.sh.
          script: bash e2e/run-android-ci.sh

      - name: Copy Maestro session dir on failure
        if: failure()
        run: |
          LATEST=$(ls -dt ~/.maestro/tests/*/ 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            mkdir -p e2e/_artifacts/maestro-session
            cp -R "$LATEST" e2e/_artifacts/maestro-session/ || true
          fi

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-artifacts-android-${{ matrix.shard }}
          path: e2e/_artifacts/
          retention-days: 7
          if-no-files-found: warn

  ios-build:
    name: iOS Release build
    needs: resolve
    if: ${{ needs.resolve.outputs.ios == 'true' }}
    runs-on: macos-26
    # A cold DerivedData miss (run 32161343357) spent ~57m on the compile.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Restore iOS DerivedData cache
        uses: actions/cache@v5
        with:
          path: build/ios-ci
          key: ios-derived-v1-${{ runner.os }}-xcode26.3-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ios-derived-v1-${{ runner.os }}-xcode26.3-${{ hashFiles('package-lock.json') }}-
            ios-derived-v1-${{ runner.os }}-xcode26.3-

      - name: Select Xcode 26
        # expo-modules-jsi's Package.swift requires swift-tools 6.2 (Xcode 26)
        # and its Swift sources build only on Xcode 26.4+ (Expo issue #47875), so
        # the iOS job runs on macos-26 and pins the same toolchain as deploy.yml.
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Install CocoaPods
        # `ios/` is committed, so `expo prebuild` reports "reusing /ios" and skips
        # the CocoaPods step entirely — leaving a CI checkout with no `ios/Pods/`
        # and an xcodebuild that dies on a missing `Pods-Threadbase.release
        # .xcconfig`. Prebuild first (it can rewrite the pbxproj), then install
        # pods against the result. No `--deployment`: prebuilt-artifact pods
        # regenerate fresh checksums on CI, which `--deployment` rejects.
        run: |
          npx expo prebuild --platform ios --no-clean
          (cd ios && bundle exec pod install)
          ./scripts/reset-podfile-lock-path-noise.sh

      # E2E has no use for uploaded source maps and no Sentry secrets, but the
      # Sentry config plugin injects a sentry-cli phase into every Release build
      # and that phase exits 65 without credentials — killing the job ~90 seconds
      # into the compile, before any Maestro flow runs. `development` skips the
      # upload; deploy.yml stays on the strict default.
      - name: Resolve app env (skips the Sentry source-map upload)
        env:
          APP_ENV: development
        run: ./scripts/check-sentry-env.sh >> "$GITHUB_ENV"

      - name: Build iOS app (Release)
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: true
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Threadbase.xcworkspace \
            -scheme Threadbase \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-ci \
            build
          APP_PATH=$(find build/ios-ci/Build/Products/Release-iphonesimulator -name "Threadbase.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo '::error::xcodebuild succeeded but Threadbase.app was not under build/ios-ci.'
            exit 1
          fi
          echo "Built $APP_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS Release app
        uses: actions/upload-artifact@v6
        with:
          name: e2e-ios-app
          path: build/ios-ci/Build/Products/Release-iphonesimulator/Threadbase.app
          if-no-files-found: error
          retention-days: 1

  ios-maestro:
    name: E2E maestro (ios ${{ matrix.shard }}/${{ matrix.total }})
    needs: [resolve, ios-build]
    if: ${{ needs.resolve.outputs.ios == 'true' }}
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.ios-shards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Download iOS Release app
        uses: actions/download-artifact@v6
        with:
          name: e2e-ios-app
          path: build/ios-ci/Build/Products/Release-iphonesimulator

      - name: Install Maestro CLI
        run: |
          MAESTRO_VERSION=$(node -p "require('./e2e/maestro-version.json').version")
          curl -fsSL "https://get.maestro.mobile.dev" | env MAESTRO_VERSION="$MAESTRO_VERSION" bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          INSTALLED_MAESTRO_VERSION=$(MAESTRO_CLI_NO_ANALYTICS=1 "$HOME/.maestro/bin/maestro" --version | tail -n 1)
          if [ "$INSTALLED_MAESTRO_VERSION" != "$MAESTRO_VERSION" ]; then
            echo "::error::Expected Maestro $MAESTRO_VERSION, installed $INSTALLED_MAESTRO_VERSION."
            exit 1
          fi
          echo "Maestro $INSTALLED_MAESTRO_VERSION"

      - name: Boot iOS simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json | jq -r '.devices | to_entries | map(select(.key | contains("iOS"))) | sort_by(.key) | reverse | .[0].value | map(select(.name | test("iPhone 1[5-9]"))) | .[0].udid')
          echo "Booting simulator: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          echo "IOS_UDID=$DEVICE" >> "$GITHUB_ENV"

      - name: Install iOS app
        run: |
          set -euo pipefail
          APP_PATH=$(find build/ios-ci/Build/Products/Release-iphonesimulator -name "Threadbase.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo '::error::Downloaded Threadbase.app was not found.'
            exit 1
          fi
          xcrun simctl install booted "$APP_PATH"

      - name: Run Maestro E2E suite on iOS
        env:
          FLOWS: ${{ matrix.flows }}
          # The XCTest driver took about 203 seconds to start in run 33165429413.
          # Leave headroom for macOS runner variance instead of failing at Maestro's
          # default 120-second startup deadline before any app flow starts.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
          # Tells e2e/ensure-release-build.js that the step above already installed
          # the Release app. Without it the script cannot find a build under
          # `-derivedDataPath build/ios-ci` and rebuilds from scratch with
          # `expo run:ios`, which never returns.
          E2E_PLATFORM: ios
        run: |
          set -euo pipefail
          mkdir -p e2e/_artifacts/debug e2e/_artifacts/fallback
          for f in $FLOWS; do
            case "$f" in
              e2e/*.yaml) ;;
              *) echo "::error::Refusing flow '$f' — expected a path like e2e/<name>.yaml."; exit 1 ;;
            esac
            if [ ! -f "$f" ]; then
              echo "::error::No such flow: $f"
              exit 1
            fi
          done
          echo "Running flows: $FLOWS" >> "$GITHUB_STEP_SUMMARY"
          node e2e/check-sim.js
          node e2e/ensure-release-build.js
          MOCK_PORTS=7071,7072 node e2e/mock-server.js &
          MOCK_PID=$!
          sleep 1
          set +e
          node e2e/run-maestro.js test --debug-output e2e/_artifacts/debug --test-output-dir e2e/_artifacts/maestro-output $FLOWS
          STATUS=$?
          set -e
          kill "$MOCK_PID" 2>/dev/null || true
          exit $STATUS

      - name: Capture iOS simulator screenshot on failure
        if: ${{ failure() }}
        run: xcrun simctl io booted screenshot e2e/_artifacts/fallback/sim-at-failure.png || true

      - name: Copy Maestro session dir on failure
        if: failure()
        run: |
          LATEST=$(ls -dt ~/.maestro/tests/*/ 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            mkdir -p e2e/_artifacts/maestro-session
            cp -R "$LATEST" e2e/_artifacts/maestro-session/ || true
          fi

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-artifacts-ios-${{ matrix.shard }}
          path: e2e/_artifacts/
          retention-days: 7
          if-no-files-found: warn

  e2e-maestro:
    name: E2E maestro
    needs: [resolve, android-apk, android-maestro, ios-build, ios-maestro]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report shard results
        env:
          RESOLVE: ${{ needs.resolve.result }}
          ANDROID: ${{ needs.resolve.outputs.android }}
          IOS: ${{ needs.resolve.outputs.ios }}
          ANDROID_APK: ${{ needs.android-apk.result }}
          ANDROID_MAESTRO: ${{ needs.android-maestro.result }}
          IOS_BUILD: ${{ needs.ios-build.result }}
          IOS_MAESTRO: ${{ needs.ios-maestro.result }}
        run: |
          set -euo pipefail
          if [ "$RESOLVE" != "success" ]; then
            echo "::error::Failed to resolve E2E target (result=$RESOLVE)."
            exit 1
          fi
          OK=1
          if [ "$ANDROID" = "true" ]; then
            if [ "$ANDROID_APK" != "success" ] || [ "$ANDROID_MAESTRO" != "success" ]; then
              echo "::error::Android E2E failed (apk=$ANDROID_APK, maestro=$ANDROID_MAESTRO)."
              OK=0
            fi
          fi
          if [ "$IOS" = "true" ]; then
            if [ "$IOS_BUILD" != "success" ] || [ "$IOS_MAESTRO" != "success" ]; then
              echo "::error::iOS E2E failed (build=$IOS_BUILD, maestro=$IOS_MAESTRO)."
              OK=0
            fi
          fi
          if [ "$OK" != "1" ]; then
            exit 1
          fi

  notify-e2e-failure:
    name: Notify on E2E failure
    needs: e2e-maestro
    # A dependent failure ordinarily skips this job. `always()` makes it run
    # after the Android/iOS matrix completes, while the result check suppresses
    # notifications for successful, skipped, and cancelled E2E runs.
    if: ${{ always() && needs.e2e-maestro.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      # CI_ALERT_WEBHOOK is unset until a channel (Slack/Discord/ntfy/etc.) is
      # chosen — see docs/deploy-failure-notifications-plan.md. Until then this
      # step is a clean no-op so a missing secret never fails the run.
      - name: Send alert
        env:
          WEBHOOK_URL: ${{ secrets.CI_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORMS: ${{ github.event_name == 'schedule' && 'android, ios' || inputs.platform }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::notice::CI_ALERT_WEBHOOK secret not set — skipping notification. See docs/deploy-failure-notifications-plan.md to configure a channel."
            exit 0
          fi
          # GitHub context values are passed through env: above and referenced
          # here as shell variables, then handed to jq -n --arg — never
          # string-interpolated straight into a shell-quoted JSON body, which is
          # a workflow-injection vector the repo's PostToolUse hook flags.
          MESSAGE=$(printf 'Threadbase Mobile E2E Weekly 🤖\n🚨 E2E run failed\n📱 Platform: %s\n🌐 View run: %s' "$PLATFORMS" "$RUN_URL")
          PAYLOAD=$(jq -n --arg t "$MESSAGE" '{text: $t}')
          # Preserve the destination's response body so Telegram errors (for
          # example, an invalid bot token or chat_id) identify the secret
          # configuration problem instead of producing an opaque curl 22.
          curl -sS --fail-with-body -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
