name: "Run CI"
description: "Sets up Node 22 with npm cache, restores cached node_modules, and runs the given CI command."

inputs:
  run:
    description: "The shell command to run (e.g. 'npm run typecheck')."
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Node 22
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm

    - name: Restore node_modules cache
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: node_modules
        key: node-modules-v2-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - name: Run command
      shell: bash
      env:
        CI_RUN: ${{ inputs.run }}
      run: bash -c "$CI_RUN"
