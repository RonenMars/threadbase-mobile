<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=700">
<title>Threadbase — Color Palette: Ink</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--tb-ink-1); }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1.1 / 1; border-radius: 10px; border: 1px solid rgba(255,255,255,0.04); padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
  .name { font: 600 11px/1 var(--font-sans); color: var(--tb-fg-1); letter-spacing: 0.02em; }
  .hex  { font: 500 10px/1 var(--font-mono); color: var(--tb-fg-3); }
  .label { font: 600 11px/1 var(--font-sans); color: var(--tb-fg-2); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="label">Ink — Surfaces & Hairlines</div>
  <div class="row">
    <div class="sw" style="background:var(--tb-ink-0)"><span class="name">ink-0</span><span class="hex">#04070b</span></div>
    <div class="sw" style="background:var(--tb-ink-1)"><span class="name">ink-1</span><span class="hex">#070b11</span></div>
    <div class="sw" style="background:var(--tb-ink-2)"><span class="name">ink-2</span><span class="hex">#0b1220</span></div>
    <div class="sw" style="background:var(--tb-ink-3)"><span class="name">ink-3</span><span class="hex">#0f1a2c</span></div>
    <div class="sw" style="background:var(--tb-ink-4)"><span class="name">ink-4</span><span class="hex">#152238</span></div>
    <div class="sw" style="background:var(--tb-ink-5)"><span class="name">ink-5</span><span class="hex">#1a2d47</span></div>
    <div class="sw" style="background:var(--tb-ink-6)"><span class="name">ink-6</span><span class="hex">#243a59</span></div>
    <div class="sw" style="background:var(--tb-ink-7)"><span class="name">ink-7</span><span class="hex">#2a4060</span></div>
  </div>
</body>
</html>
