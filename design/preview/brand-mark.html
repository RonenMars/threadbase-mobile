<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Threadbase — Brand Mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--tb-ink-1); display:grid; gap:14px; grid-template-columns: 1fr 1fr; align-items:center; }
  .label { font: 600 11px/1 var(--font-sans); color: var(--tb-fg-2); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .col { display:flex; flex-direction: column; align-items:flex-start; gap: 8px; }
  .row { display:flex; gap:12px; align-items:center; }
  img { width:88px; height: 88px; }
  .meta { font: 500 11px/1.4 var(--font-mono); color: var(--tb-fg-3); }
</style>
</head>
<body>
  <div class="col">
    <div class="label">Brand Mark · primary</div>
    <div class="row">
      <img src="../assets/threadbase-icon.svg" alt="Threadbase">
      <div class="meta">threadbase-icon.svg<br>512 × 512 · rx 96<br>thread spine motif</div>
    </div>
  </div>
  <div class="col">
    <div class="label">Brand Mark · chat variant</div>
    <div class="row">
      <img src="../assets/threadbase-icon-chat.svg" alt="Threadbase chat">
      <div class="meta">threadbase-icon-chat.svg<br>512 × 512 · rx 96<br>conversation surfaces</div>
    </div>
  </div>
</body>
</html>
