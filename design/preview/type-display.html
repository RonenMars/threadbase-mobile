<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Threadbase — Type Display Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--tb-ink-1); }
  .row { display:flex; align-items:baseline; gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--color-divider); }
  .row:last-child { border:0; }
  .meta { font: 500 10px/1 var(--font-mono); color: var(--tb-fg-3); width: 90px; flex:none; }
  .label { font: 600 11px/1 var(--font-sans); color: var(--tb-fg-2); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="label">Type — Display & Headings · Inter</div>
  <div class="row"><span class="meta">60/64 · 600</span><span class="tb-display" style="font-size:36px;line-height:40px">Resume the thread.</span></div>
  <div class="row"><span class="meta">36/44 · 600</span><span class="tb-h1">Conversations, kept.</span></div>
  <div class="row"><span class="meta">24/32 · 600</span><span class="tb-h2">Search across every session.</span></div>
  <div class="row"><span class="meta">18/26 · 600</span><span class="tb-h3">Pick up where Claude left off.</span></div>
  <div class="row"><span class="meta">15/22 · 600</span><span class="tb-h4">Sub-section heading</span></div>
</body>
</html>
