<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Threadbase — Shadows & Glow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--tb-ink-1); }
  .label { font: 600 11px/1 var(--font-sans); color: var(--tb-fg-2); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px; }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .card { aspect-ratio: 1.4 / 1; background: var(--tb-ink-2); border: 1px solid var(--tb-ink-5); border-radius: 12px; display:flex; flex-direction:column; justify-content:flex-end; padding: 10px; }
  .card .n { font: 600 11px/1 var(--font-sans); color: var(--tb-fg-1); }
  .card .v { font: 500 10px/1.3 var(--font-mono); color: var(--tb-fg-3); margin-top:4px; }
  .blue { box-shadow: var(--shadow-glow-blue); }
  .amber { box-shadow: var(--shadow-glow-amber); }
  .lg   { box-shadow: var(--shadow-lg); }
  .md   { box-shadow: var(--shadow-md); }
</style>
</head>
<body>
  <div class="label">Elevation — Shadows & Brand Glow</div>
  <div class="grid">
    <div class="card md"><span class="n">md</span><span class="v">resting card</span></div>
    <div class="card lg"><span class="n">lg</span><span class="v">floating sheet / popover</span></div>
    <div class="card blue"><span class="n">glow / blue</span><span class="v">active brand element</span></div>
    <div class="card amber"><span class="n">glow / amber</span><span class="v">live · running · now</span></div>
  </div>
</body>
</html>
